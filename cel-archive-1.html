<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:dark}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Cel Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=IBM+Plex+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#150C28; --surface:#1E1240; --surface-2:#2A1A4E; --ink:#F3EEFF; --muted:#9A7FD0; --line:#3A2566;
  --accent:#B8FF3C; --accent-ink:#150C28; --accent-soft:#273A17;
  --st-watching:#3DE0A0; --st-completed:#5C9BFF; --st-on_hold:#E0AE45; --st-dropped:#FF5C82; --st-plan:#9A7FD0; --st-unfinished:#C08CFF;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 26px -12px rgba(0,0,0,.7);
  --display:"Dela Gothic One","Arial Black",Impact,sans-serif;
  --body:"Zen Kaku Gothic New",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#150C28; --surface:#1E1240; --surface-2:#2A1A4E; --ink:#F3EEFF; --muted:#9A7FD0; --line:#3A2566;
  --accent:#B8FF3C; --accent-ink:#150C28; --accent-soft:#273A17;
  --st-watching:#3DE0A0; --st-completed:#5C9BFF; --st-on_hold:#E0AE45; --st-dropped:#FF5C82; --st-plan:#9A7FD0; --st-unfinished:#C08CFF;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 26px -12px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#150C28; --surface:#1E1240; --surface-2:#2A1A4E; --ink:#F3EEFF; --muted:#9A7FD0; --line:#3A2566;
  --accent:#B8FF3C; --accent-ink:#150C28; --accent-soft:#273A17;
  --st-watching:#3DE0A0; --st-completed:#5C9BFF; --st-on_hold:#E0AE45; --st-dropped:#FF5C82; --st-plan:#9A7FD0; --st-unfinished:#C08CFF;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 26px -12px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0 64px}
.wrap{max-width:1180px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* header */
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;padding-block:22px 14px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font-family:var(--display);font-weight:400;font-size:clamp(26px,5vw,36px);letter-spacing:.01em;line-height:1}
.brand .perf{display:inline-flex;gap:3px;transform:translateY(-4px)}
.brand .perf i{width:7px;height:10px;border-radius:2px;background:var(--accent)}
.brand .perf i:nth-child(2){opacity:.6}.brand .perf i:nth-child(3){opacity:.3}
.sync{font-family:var(--mono);font-size:11.5px;color:var(--muted);letter-spacing:.02em;display:flex;align-items:center;gap:6px}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.ok::before{background:var(--st-watching)}
.sync.local::before{background:var(--st-on_hold)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:500;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--st-dropped);border-color:color-mix(in srgb,var(--st-dropped) 45%,var(--line))}
.btn.danger.armed{background:var(--st-dropped);color:#fff;border-color:var(--st-dropped)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}

/* stats band */
.band{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:18px}
.stat{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.stat .v{font-family:var(--display);font-size:28px;line-height:1.15;font-variant-numeric:tabular-nums}
.stat .s{font-size:12px;color:var(--muted)}
.hist{background:var(--surface);padding:12px 16px 10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.hist .bars{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;align-items:end;height:74px}
.hist .bar{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:2px}
.hist .bar span{font-family:var(--mono);font-size:10px;color:var(--muted);line-height:1}
.hist .bar b{display:block;width:100%;border-radius:3px 3px 1px 1px;background:var(--accent);min-height:2px;opacity:.85}
.hist .bar b.zero{background:var(--line);opacity:1}
.hist .axis{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;font-family:var(--mono);font-size:10.5px;color:var(--muted);text-align:center;border-top:1px solid var(--line);padding-top:3px}
.band .hist{grid-column:1/-1}
.stat.lead .v{color:var(--accent)}
@media (max-width:1000px){.band{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.band{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* toolbar */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:500;display:inline-flex;gap:7px;align-items:center;color:var(--muted)}
.tab .n{font-family:var(--mono);font-size:11.5px}
.tab .dot{width:8px;height:8px;border-radius:50%}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab.review{border-style:dashed}
.filters{display:grid;grid-template-columns:minmax(0,2fr) repeat(3,minmax(0,1fr));gap:8px;margin-bottom:16px}
@media (max-width:700px){.filters{grid-template-columns:1fr 1fr}.filters .search{grid-column:1/-1}}
/* stats & taste collapsible */
.statsToggle{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-weight:600;font-size:13.5px;color:var(--ink);margin-bottom:14px;font-family:inherit}
.statsToggle:hover{border-color:var(--muted)}
.collapsibleStats[hidden]{display:none}
/* library: rail + grid */
.libwrap{display:flex;gap:18px;align-items:flex-start}
.rail{flex:0 0 212px;position:sticky;top:12px;display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 10px}
.railSec+.railSec{margin-top:8px}
.railLbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800;padding:8px 10px 4px}
.railItem{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:transparent;border:none;color:var(--ink);font-family:inherit;font-size:13.5px;font-weight:600;padding:8px 10px;border-radius:9px;cursor:pointer}
.railItem:hover{background:var(--surface-2)}
.railItem[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.railItem .rlabel{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.railItem .rn{font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.railItem[aria-pressed="true"] .rn{color:var(--accent-ink)}
.railItem .rdot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.libmain{flex:1;min-width:0}
@media (max-width:760px){
  .libwrap{display:block}
  .rail{position:static;flex:none;flex-direction:row;align-items:center;overflow-x:auto;gap:6px;margin-bottom:14px;scrollbar-width:none;padding:10px}
  .rail::-webkit-scrollbar{display:none}
  .railSec{display:flex;align-items:center;gap:6px;flex:0 0 auto}
  .railSec+.railSec{margin-top:0;border-left:1px solid var(--line);padding-left:8px}
  .railLbl{padding:0 2px;white-space:nowrap}
  .railItem{width:auto;flex:0 0 auto;white-space:nowrap;border:1px solid var(--line)}
  .railItem .rlabel{overflow:visible}
}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>label,.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
input[type=text],input[type=number],input[type=search],input[type=date],select,textarea{width:100%;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:14px}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
@media (max-width:560px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.ptitle{font-size:13px}}
/* poster-forward cards */
.card{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:0;display:flex;flex-direction:column;box-shadow:var(--shadow);overflow:hidden;min-width:0;cursor:pointer}
.card:hover{border-color:var(--muted)}
.card:hover .cposter,.card:hover .pfallback{transform:scale(1.04)}
.posterbox{position:relative;aspect-ratio:2/3;overflow:hidden;background:var(--surface-2)}
.pfallback{position:absolute;inset:0;transition:transform .25s ease}
.card .cposter{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s ease}
.card.noimg .cposter{display:none}
.medal{position:absolute;top:8px;right:8px;min-width:30px;height:30px;padding:0 7px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.45);border:2px solid var(--bg)}
.medal.none{background:var(--surface-2);color:var(--muted);border-color:var(--line)}.ccrown{position:absolute;top:8px;left:8px;width:30px;height:30px;border-radius:999px;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#ffe27a,#f5a623);color:#2a1800;box-shadow:0 2px 10px rgba(245,166,35,.55),0 0 0 2px var(--bg);z-index:4;pointer-events:none}.ccrown svg{width:17px;height:17px}.card.example .ccrown{display:none}
.favbtn{position:absolute;top:8px;left:8px;width:30px;height:30px;border-radius:50%;border:none;background:rgba(10,6,20,.5);color:#fff;font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer}
.favbtn[aria-pressed="true"]{color:var(--accent)}
.rvwbadge{position:absolute;left:8px;bottom:8px;font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;background:var(--st-on_hold);color:#150C28;padding:2px 7px;border-radius:999px}
.card .example-tag{top:8px;left:8px;right:auto}
.cardfoot{padding:10px 12px 12px;display:flex;flex-direction:column;gap:7px;min-width:0}
.ptitle{font-weight:700;font-size:14.5px;line-height:1.22;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cfrow{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}
.cfrow .plus{margin-left:auto}
.stchip{flex:0 0 auto;font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--st) 24%,transparent);color:var(--st)}
.cmeta{flex:1;min-width:0;font-family:var(--mono);font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cfrow .plus{flex:0 0 auto;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;color:var(--ink);font-weight:800;font-size:12px;padding:3px 9px;cursor:pointer;line-height:1}
.cfrow .plus:hover{border-color:var(--accent);color:var(--accent)}
.cfrow .favbtn2{flex:0 0 auto;background:transparent;border:none;color:var(--muted);font-size:16px;line-height:1;cursor:pointer;padding:0 2px}
.cfrow .favbtn2[aria-pressed="true"]{color:var(--accent)}
/* retained (used outside the card too) */
.chip{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink)}
.flag{font-size:11.5px;padding:2px 8px;border-radius:999px;border:1px dashed var(--st-on_hold);color:var(--st-on_hold)}
.fav{color:var(--accent);font-size:15px;line-height:1}
.example-tag{position:absolute;top:10px;right:10px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:var(--accent-soft);color:var(--accent);padding:2px 6px;border-radius:4px}
.card.example{opacity:.8;border-style:dashed}
.banner{border:1px dashed var(--accent);background:var(--accent-soft);border-radius:12px;padding:12px 14px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.banner p{margin:0;max-width:70ch}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.loading{padding:60px 16px;text-align:center;color:var(--muted);font-family:var(--mono);font-size:13px}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(10,12,20,.5);z-index:50;display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:max(16px,env(safe-area-inset-top,0px)) 12px max(16px,env(safe-area-inset-bottom,0px))}
.sheet{background:var(--bg);border:1px solid var(--line);border-radius:16px;width:100%;max-width:720px;margin-block:auto;box-shadow:0 20px 60px -20px rgba(0,0,0,.5);display:flex;flex-direction:column}
.sheet.wide{max-width:1000px}
.sheet header{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.sheet header h2{font-family:var(--display);font-weight:400;font-size:20px;margin-right:auto}
.sheet .body{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.sheet .foot-bar{display:flex;flex-wrap:wrap;gap:8px;padding:14px 18px;border-top:1px solid var(--line);align-items:center}
.sheet .foot-bar .sp{margin-right:auto}
.x{border:none;background:transparent;font-size:22px;line-height:1;color:var(--muted);padding:4px 8px}
.form-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.c6{grid-column:span 6}.c3{grid-column:span 3}.c2{grid-column:span 2}
@media (max-width:560px){.c3,.c2{grid-column:span 3}}
.gpick{display:flex;flex-wrap:wrap;gap:6px}
.gpick button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12.5px}
.gpick button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.scorepick{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.scorepick button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 0;font-family:var(--mono);font-weight:500}
.scorepick button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.scorehint{font-size:12.5px;color:var(--muted);min-height:1.2em}
.check{display:inline-flex;align-items:center;gap:8px;font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.flagbox{border:1px dashed var(--st-on_hold);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.flagbox ul{margin:0;padding-left:18px;font-size:13.5px}
.help{font-size:13px;color:var(--muted);margin:0;max-width:75ch}
.help code,.raw{font-family:var(--mono);font-size:12px;background:var(--surface-2);padding:1px 5px;border-radius:4px}

/* import rows */
.irows{display:flex;flex-direction:column;gap:8px}
.irow{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:auto minmax(0,3fr) repeat(7,minmax(0,1fr));gap:8px;align-items:end}
.irow.off{opacity:.45}
.irow.flagged{border-color:color-mix(in srgb,var(--st-on_hold) 60%,var(--line))}
.irow .inc{align-self:center}
.irow .field>label{font-size:10px}
.irow input,.irow select{padding:6px 8px;font-size:13.5px}
.irow .under{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.irow .genres{grid-column:2/-1}
@media (max-width:760px){.irow{grid-template-columns:auto repeat(2,minmax(0,1fr))}.irow .tt{grid-column:2/-1}.irow .under,.irow .genres{grid-column:1/-1}}
.isum{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:13.5px}
.isum b{font-family:var(--mono)}
.progressline{height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden}
.progressline b{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}

.was{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:2px}
.seasons{display:flex;flex-wrap:wrap;gap:4px}
.seasons span{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--muted);display:inline-flex;gap:5px}
.seasons span b{color:var(--ink);font-weight:500}
.seasons span.up b{color:var(--st-watching)}.seasons span.down b{color:var(--st-dropped)}
.past{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.past ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.past li{font-size:13.5px;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:baseline}
.past li .sc{font-family:var(--display);font-size:18px;grid-row:span 2}
.past li .when{font-size:12px;color:var(--muted)}
.past li .q{grid-column:2;font-size:13px;color:var(--ink)}
.past li.now .sc{color:var(--accent)}
.shead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.shead .lbl{margin-right:auto}
.shead input{width:72px}
.slist{display:flex;flex-direction:column;gap:6px}
.srow{display:grid;grid-template-columns:80px auto 170px minmax(0,1fr) auto;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.srow .sn{font-weight:700;font-size:13.5px}
.srow select,.srow input[type=text]{padding:6px 8px;font-size:13.5px}.srow .sdel{padding:5px 8px;font-size:12px}
.srow.new{border-color:var(--accent)}
@media (max-width:520px){.srow{grid-template-columns:auto auto 1fr auto}.srow input[type=text]{grid-column:1/-1}.srow select{grid-column:1/3}}
.shint{font-size:13px;color:var(--accent);min-height:0}
details.opt summary{cursor:pointer;font-size:13px;color:var(--muted);font-weight:500}
details.opt[open] summary{margin-bottom:10px}
.taste{margin-bottom:18px;display:flex;flex-direction:column;gap:10px}
.taste .thead{display:flex;align-items:baseline;gap:10px}
.taste .thead h2{font-family:var(--display);font-weight:400;font-size:20px;margin-right:auto}
.taste .thead button{border:none;background:none;color:var(--muted);font-size:13px;padding:4px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tcard .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.tcard .v{font-family:var(--display);font-size:19px;line-height:1.2;overflow-wrap:anywhere}
.tcard .s{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.tcard.hero{border-color:var(--accent);background:linear-gradient(135deg,var(--accent-soft),var(--surface) 70%)}
.gbars{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.gbars .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;justify-content:space-between}

<script>
(function(){
"use strict";

/* ---------- vocabulary ---------- */
const STATUSES=[
  {k:"watching",label:"Watching"},
  {k:"completed",label:"Completed"},
  {k:"unfinished",label:"Unfinished"},
  {k:"on_hold",label:"On hold"},
  {k:"dropped",label:"Dropped"},
  {k:"plan",label:"Plan to watch"}];
const ST_LABEL=Object.fromEntries(STATUSES.map(s=>[s.k,s.label]));
const KINDS=[
  {k:"anime",label:"Anime"},
  {k:"donghua",label:"Donghua (dongman)"},
  {k:"cartoon",label:"Cartoon"},
  {k:"aeni",label:"Aeni (Korean)"},
  {k:"other",label:"Other animation"}];
const KIND_LABEL=Object.fromEntries(KINDS.map(s=>[s.k,s.label]));
const TYPES=["TV","Movie","OVA","ONA","Special","Short","Web series"];
const GENRES=["Action","Adventure","Comedy","Drama","Fantasy","Romance","Sci-Fi","Slice of Life","Mystery","Horror","Thriller","Psychological","Supernatural","Sports","Mecha","Music","Isekai","Historical","Martial Arts","Military","School","Space","Detective","Vampire","Parody","Family","Kids","Harem","Ecchi","Iyashikei","Mahou Shoujo","Idol","Yuri","Yaoi (BL)","Gore","Cultivation","Wuxia","Xianxia"];
const GENRE_ALIAS={"sci fi":"Sci-Fi","scifi":"Sci-Fi","science fiction":"Sci-Fi","sol":"Slice of Life","slice-of-life":"Slice of Life","romcom":["Romance","Comedy"],"rom com":["Romance","Comedy"],"rom-com":["Romance","Comedy"],"psych":"Psychological","sport":"Sports","martial art":"Martial Arts","romantic":"Romance","funny":"Comedy","scary":"Horror","mech":"Mecha","robots":"Mecha","magic":"Fantasy","superpower":"Supernatural","super power":"Supernatural","magical girl":"Mahou Shoujo","mahou shojo":"Mahou Shoujo","healing":"Iyashikei","bl":"Yaoi (BL)","boys love":"Yaoi (BL)","boys' love":"Yaoi (BL)","yaoi":"Yaoi (BL)","shounen-ai":"Yaoi (BL)","shonen-ai":"Yaoi (BL)","gl":"Yuri","girls love":"Yuri","girls' love":"Yuri","shoujo-ai":"Yuri","shojo-ai":"Yuri","idols":"Idol","gory":"Gore","reverse harem":"Harem"};
GENRES.forEach(g=>{GENRE_ALIAS[g.toLowerCase()]=g});
const DEMOS=[{k:"shounen",label:"Shounen"},{k:"seinen",label:"Seinen"},{k:"shoujo",label:"Shoujo"},{k:"josei",label:"Josei"},{k:"kodomo",label:"Kids (Kodomo)"},{k:"general",label:"General / all ages"}];
const DEMO_LABEL=Object.fromEntries(DEMOS.map(d=>[d.k,d.label]));
function demoOf(v){const t=String(v||"").toLowerCase().trim();if(!t)return null;
  if(/^sh[oō]u?nen$/.test(t))return "shounen";if(t==="seinen")return "seinen";if(/^sh[oō]u?jo$/.test(t))return "shoujo";if(t==="josei")return "josei";
  if(/^(kodomo|kids?|children)/.test(t))return "kodomo";if(/^(general|all ages|everyone|family)/.test(t))return "general";return null}
const SCORE_LABEL={10:"Masterpiece",9:"Great",8:"Very good",7:"Good",6:"Fine",5:"Average",4:"Bad",3:"Very bad",2:"Horrible",1:"Appalling"};

const EXAMPLES=[
  {id:"ex1",title:"Attack on Titan",kind:"anime",demo:"shounen",type:"TV",year:2013,status:"completed",score:9,genres:["Action","Drama"],seasons:[{n:1,watched:true},{n:2,watched:true,effect:-1,note:"Dragged a bit"},{n:3,watched:true,effect:1},{n:4,watched:true,effect:1}],scoreHistory:[{score:8,date:1614600000000,note:"Great but slow start"}],scoreReason:"The final season changed everything",watchedYear:2023,favorite:true,updatedAt:3},
  {id:"ex2",title:"Mo Dao Zu Shi",altTitle:"The Founder of Diabolism",kind:"donghua",type:"ONA",year:2018,status:"watching",score:9,genres:["Fantasy","Xianxia"],seasons:[{n:1,watched:true},{n:2,watched:true,effect:1},{n:3,watched:false}],updatedAt:2},
  {id:"ex3",title:"Avatar: The Last Airbender",kind:"cartoon",type:"TV",year:2005,status:"completed",score:10,genres:["Adventure","Fantasy","Martial Arts"],seasons:[{n:1,watched:true},{n:2,watched:true},{n:3,watched:true}],watchedYear:2012,updatedAt:1}];

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const norm=t=>String(t||"").toLowerCase().normalize("NFKD").replace(/[^\p{L}\p{N}]+/gu,"");
const newId=()=>"t"+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const isMovie=it=>!!it&&it.type==="Movie";
function seasonsOf(it){return it&&Array.isArray(it.seasons)?it.seasons:[]}
function fmtDate(t){if(!t)return "";try{return new Date(t).toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"})}catch(e){return ""}}
const toInt=v=>{const n=parseInt(v,10);return Number.isFinite(n)?n:null};
/* scores live on a 1–10 scale; coerce anything else into range (18 -> 10) or null */
const safeScore=s=>{if(s==null||s==="")return null;const n=Math.round(Number(s));return Number.isFinite(n)&&n>=1?Math.min(10,n):null};
let toastTimer;
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,3200)}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* ---------- storage ---------- */
const LS_KEY="celarchive.items.v1";
const store={
  mode:"loading",col:null,items:new Map(),listeners:[],
  async init(){
    let db=null;
    try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
    if(db){
      this.mode="cloud";this.col=db.collection("titles");
      this.col.onSnapshot(snap=>{
        const m=new Map();snap.docs.forEach(d=>{const v=d.data();if(v)m.set(d.id,{...v,id:d.id})});
        this.items=m;this.emit();
      },err=>{
        toast("Lost connection to your saved library. Reload the page to reconnect.");
        setSync("local","Connection lost");
      });
    }else{
      this.mode="local";
      try{const raw=lsGet(LS_KEY);const arr=raw?JSON.parse(raw):[];let fixed=0;
        arr.forEach(x=>{
          if(x&&"score"in x){const sc=safeScore(x.score);if(sc!==x.score){x.score=sc;fixed++}}
          if(x&&Array.isArray(x.scoreHistory))x.scoreHistory.forEach(h=>{if(h&&"score"in h){const sc=safeScore(h.score);if(sc!==h.score){h.score=sc;fixed++}}});
          this.items.set(x.id,x);
        });
        if(fixed)lsSet(LS_KEY,JSON.stringify([...this.items.values()]));
      }catch(e){}
      this.emit();
    }
  },
  persistLocal(){clearTimeout(this._pt);this._pt=setTimeout(()=>this.flush(),150)},
  flush(){clearTimeout(this._pt);this._pt=null;if(this.mode==="local")lsSet(LS_KEY,JSON.stringify([...this.items.values()]))},
  async put(item){
    const clean=JSON.parse(JSON.stringify(item));
    if(this.mode==="cloud"){await this.col.doc(item.id).set(clean)}
    else{this.items.set(item.id,clean);this.persistLocal();this.emit()}
  },
  async remove(id){
    if(this.mode==="cloud"){await this.col.doc(id).delete()}
    else{this.items.delete(id);this.persistLocal();this.emit()}
  },
  onChange(fn){this.listeners.push(fn)},
  emit(){this.loaded=true;if(this._et)return;this._et=setTimeout(()=>{this._et=null;this.listeners.forEach(f=>f())},40)}
};
/* hook so other tabs (e.g. Upcoming) can add/update a library entry and trigger a re-render */
window.CelArchiveLibrary={
  get:function(id){return store.items.get(id)},
  has:function(id){return store.items.has(id)},
  put:function(it){return store.put(it)},
  remove:function(id){return store.remove(id)}
};
async function withRetry(fn){
  for(let a=0;;a++){
    try{return await fn()}catch(e){
      const c=e&&e.code;
      if((c==="resource_exhausted"||c==="unavailable")&&a<6){await sleep(500*2**a+Math.random()*400);continue}
      throw e;
    }
  }
}
async function writeMany(list,onProgress,conc){
  let i=0,done=0,failed=[];
  const worker=async()=>{while(i<list.length){const it=list[i++];try{await withRetry(()=>store.put(it))}catch(e){failed.push({it,e})}onProgress&&onProgress(++done,list.length)}};
  await Promise.all(Array.from({length:Math.min(conc||4,list.length||1)},worker));
  return failed;
}
function errMsg(e){
  const c=e&&e.code;
  if(c==="quota_exceeded")return "Your library is full (5,000 titles). Delete some entries to add more.";
  if(c==="invalid_argument")return "This view can’t save changes. Open the page signed in as its owner.";
  return "Couldn’t save that change. Check your connection and try again.";
}
function setSync(cls,txt){const s=$("#sync");s.className="sync "+cls;s.textContent=txt}

/* ---------- state + filters ---------- */
const state={status:"all",q:"",kind:"",format:"",genre:"",demo:"",sort:lsGet("celarchive.sort")||"updated"};
$("#fsort").value=state.sort;

function items(){return [...store.items.values()]}
function isExampleMode(){return store.loaded&&store.items.size===0}
function viewItems(){
  let list=isExampleMode()?EXAMPLES.map(x=>({...x,_example:true})):items();
  const q=state.q.trim().toLowerCase();
  list=list.filter(it=>{
    if(state.status==="review"){if(!it.needsReview)return false}
    else if(state.status==="fav"){if(!it.favorite)return false}
    else if(state.status!=="all"&&it.status!==state.status)return false;
    if(state.kind&&it.kind!==state.kind)return false;
    if(state.format==="film"&&!isMovie(it))return false;
    if(state.format==="tv"&&isMovie(it))return false;
    if(state.genre&&!(it.genres||[]).includes(state.genre))return false;
    if(state.demo&&it.demo!==state.demo)return false;
    if(q){const hay=[DEMO_LABEL[it.demo],it.title,it.altTitle,it.notes,(it.genres||[]).join(" "),it.year,KIND_LABEL[it.kind]].join(" ").toLowerCase();if(!hay.includes(q))return false}
    return true;
  });
  const by={
    updated:(a,b)=>(b.updatedAt||0)-(a.updatedAt||0),
    title:(a,b)=>String(a.title).localeCompare(String(b.title),undefined,{sensitivity:"base"}),
    score:(a,b)=>(b.score||0)-(a.score||0)||String(a.title).localeCompare(b.title),
    score_asc:(a,b)=>((a.score||Infinity)-(b.score||Infinity))||String(a.title).localeCompare(b.title),
    year_desc:(a,b)=>(b.year||0)-(a.year||0),
    year_asc:(a,b)=>(a.year||9999)-(b.year||9999),
    watched:(a,b)=>(b.watchedYear||0)-(a.watchedYear||0)||(b.updatedAt||0)-(a.updatedAt||0)};
  return list.sort(by[state.sort]||by.updated);
}

/* ---------- render ---------- */
/* ---------- counting mode: franchise (original) vs MAL style ---------- */
function countMode(){return lsGet("celarchive.countMode")==="mal"?"mal":"franchise"}
function malStatusOf(fr){return ({completed:"completed",watching:"watching",plan:"plan",on_hold:"on_hold",unfinished:"on_hold",dropped:"dropped"})[fr]||"plan"}
/* turn franchise titles into MAL-style entries: each season/OVA/movie is its own entry */
function malEntries(src){
  const out=[];
  src.forEach(it=>{
    const ss=seasonsOf(it),sc=it.score||null;
    if(isMovie(it)||!ss.length){out.push({status:malStatusOf(it.status),score:sc});return}
    let hit=false;
    ss.forEach(s=>{
      if(s.watched){out.push({status:"completed",score:sc});return}
      let st;
      if(it.status==="watching"){st=hit?"plan":"watching";hit=true}
      else if(it.status==="dropped"){st=hit?"plan":"dropped";hit=true}
      else if(it.status==="unfinished"||it.status==="on_hold"){st="on_hold"}
      else if(it.status==="completed"){st="completed"}
      else{st="plan"}
      out.push({status:st,score:sc});
    });
  });
  return out;
}
function renderBandMal(src){
  const E=malEntries(src);
  const ST=[["watching","Watching"],["completed","Completed"],["on_hold","On-Hold"],["dropped","Dropped"],["plan","Plan to Watch"]];
  const cnt=Object.fromEntries(ST.map(([k])=>[k,E.filter(e=>e.status===k).length]));
  const scoredE=E.filter(e=>e.score&&e.status!=="plan");
  const mean=scoredE.length?scoredE.reduce((a,b)=>a+b.score,0)/scoredE.length:null;
  const counts=Array.from({length:10},(_,i)=>scoredE.filter(e=>Math.round(e.score)===i+1).length);
  const max=Math.max(1,...counts);
  const total=E.length;
  const tile=(k,v,sub,cls)=>`<div class="stat${cls?" "+cls:""}"><span class="k">${k}</span><span class="v">${v}</span><span class="s">${sub}</span></div>`;
  const seg=ST.map(([k,l])=>cnt[k]?`<span class="malseg" style="flex:${cnt[k]};background:var(--st-${k})" title="${l}: ${cnt[k]}"></span>`:"").join("");
  const legend=ST.map(([k,l])=>`<span class="mallg"><i style="background:var(--st-${k})"></i>${l} <b>${cnt[k]}</b></span>`).join("");
  $("#band").innerHTML=
    tile("Total entries",total,`across ${src.length} series · each season counts`,"lead")+
    tile("Mean score",mean?mean.toFixed(2):"—",`${scoredE.length} scored entr${scoredE.length===1?"y":"ies"}`,"lead")+
    tile("Completed",cnt.completed,"entries finished")+
    tile("Watching",cnt.watching,"in progress")+
    tile("On-Hold",cnt.on_hold,"paused or unfinished")+
    tile("Dropped · Plan",cnt.dropped+" · "+cnt.plan,"dropped · planned")+
    `<div class="hist" style="grid-column:1/-1">
      <span class="k lbl" style="display:flex;justify-content:space-between;gap:8px"><span>Status breakdown</span><span>${total} entr${total===1?"y":"ies"}</span></span>
      <div class="malbar">${seg||'<span class="malseg" style="flex:1;background:var(--surface-2)"></span>'}</div>
      <div class="mallegend">${legend}</div>

/* ---------- sheets ---------- */
function openSheet(html,wide){
  const slot=$("#sheetSlot");
  slot.innerHTML=`<div class="scrim" id="scrim"><div class="sheet${wide?" wide":""}" role="dialog" aria-modal="true">${html}</div></div>`;
  const scrim=$("#scrim");
  scrim.addEventListener("mousedown",e=>{if(e.target===scrim)closeSheet()});
  slot.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeSheet);
  document.body.style.overflow="hidden";
  setTimeout(()=>{const f=slot.querySelector("[autofocus]");if(f)f.focus()},30);
  return slot.querySelector(".sheet");
}
function closeSheet(){$("#sheetSlot").innerHTML="";document.body.style.overflow=""}

function mergeImported(ex,r,now){
  const out={...ex,updatedAt:now,rawLine:r.rawLine||ex.rawLine||null};
  if(r.altTitle)out.altTitle=r.altTitle;
  ["kind","demo","type","year","watchedYear"].forEach(k=>{if(r[k])out[k]=r[k]});
  const statusChanged=!r._statusGuessed&&r.status&&r.status!==ex.status;
  if(!r._statusGuessed&&r.status)out.status=r.status;
  if(r.genres&&r.genres.length)out.genres=[...r.genres];
  if(r.notes&&!(ex.notes||"").includes(r.notes))out.notes=ex.notes?`${ex.notes}\n${r.notes}`:r.notes;
  if(r.score&&r.score!==ex.score){
    if(ex.score)out.scoreHistory=[...(ex.scoreHistory||[]),{score:ex.score,date:ex.scoreDate||ex.updatedAt||ex.createdAt||now,note:ex.scoreReason||null}];
    out.score=r.score;out.scoreDate=now;out.scoreReason="Updated from import";
  }
  if(out.type==="Movie")out.seasons=[];
  else{
    const old=seasonsOf(ex),cnt=Math.max(1,r.seasonCount||old.length||1);
    out.seasons=Array.from({length:cnt},(_,j)=>{const o={...(old[j]||{}),n:j+1};
      if(out.status==="completed")o.watched=true;
      else if(statusChanged&&(out.status==="dropped"||out.status==="plan"))o.watched=false;
      else if(statusChanged&&out.status==="unfinished")o.watched=j===0||!!o.watched;
      else o.watched=!!o.watched;
      return o});
  }
  const left=[];if(!out.year)left.push("No release year");if(!out.kind)left.push("Kind not set");
  out.flags=left;out.needsReview=left.length>0;
  return out;
}
async function runImport(){
  const inc=bulk.rows.filter(r=>r._include&&r.title&&r.title.trim());
  if(!inc.length)return;
  const now=Date.now();
  const docs=inc.map((r,k)=>{
    const ex=r._existingId&&store.items.get(r._existingId);
    if(ex)return mergeImported(ex,r,now-k);
    const flags=rowFlags(r);
    return {id:newId()+k.toString(36),title:r.title.trim(),altTitle:r.altTitle||null,kind:r.kind||null,demo:r.demo||null,type:r.type||null,year:r.year||null,status:r.status,
      score:r.score||null,scoreDate:r.score?now:null,scoreHistory:[],genres:r.genres||[],watchedYear:r.watchedYear||null,notes:r.notes||null,
      seasons:r.type==="Movie"?[]:Array.from({length:Math.max(1,r.seasonCount||1)},(_,j)=>({n:j+1,watched:r.status==="completed"||(r.status==="unfinished"&&j===0)})),
      favorite:false,rewatches:null,startDate:null,finishDate:null,needsReview:flags.length>0,flags,rawLine:r.rawLine||null,
      createdAt:now,updatedAt:now-k,source:"bulk"}});
  const go=$("#bGo");go.disabled=true;$("#bBack").disabled=true;
  const prog=$("#bProg");prog.hidden=false;const bar=prog.querySelector("b");bar.style.width="0";
  $("#bAIMsg").textContent=`Saving 0 of ${docs.length}…`;
  const failed=await writeMany(docs,(d,t)=>{bar.style.width=Math.round(d/t*100)+"%";$("#bAIMsg").textContent=`Saving ${d} of ${t}…`},4);
  if(failed.length){$("#bAIMsg").textContent=`${docs.length-failed.length} saved. ${failed.length} failed: ${errMsg(failed[0].e)}`;go.disabled=false;
    const failedIds=new Set(failed.map(f=>f.it.title));bulk.rows.forEach(r=>{if(!failedIds.has(r.title.trim()))r._include=false});return}
  const nr=docs.filter(d=>d.needsReview).length;
  const nUpd=inc.filter(r=>r._existingId&&store.items.get(r._existingId)).length;
  setTimeout(()=>findPosters(docs,false),1500);
  bulk.text="";closeSheet();
  state.status=nr?"review":"all";render();
  toast(`${nUpd?`Added ${docs.length-nUpd} new, updated ${nUpd}`:`Imported ${docs.length} titles`}${nr?`. ${nr} are in Needs review`:""}`);
}

}

  const tryOne=i=>new Promise((res,rej)=>{if(i>=srcs.length)return rej(new Error("offline"));const sc=document.createElement("script");sc.src=srcs[i];sc.onload=()=>window.ExcelJS?res():tryOne(i+1).then(res,rej);sc.onerror=()=>{sc.remove();tryOne(i+1).then(res,rej)};document.head.appendChild(sc)});

}

const AL_URL="https://graphql.anilist.co";
function cleanForSearch(t){return String(t||"").replace(/\([^)]*\)/g," ").replace(/\s+/g," ").trim()}
async function alQuery(query,variables){
  for(let a=0;a<5;a++){
    const r=await fetch(AL_URL,{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify({query,variables})});
    if(r.status===429){const ra=+(r.headers.get("Retry-After")||"30");await sleep(Math.min(90,ra)*1000+500);continue}
    const j=await r.json().catch(()=>null);if(j)return j;
    await sleep(2000);
  }
  throw new Error("anilist");
}
async function alSearchList(q){const j=await alQuery(`query($q:String){Page(perPage:8){media(search:$q,type:ANIME,sort:SEARCH_MATCH){id siteUrl seasonYear format genres countryOfOrigin startDate{year} title{romaji english native} tags{name category} coverImage{large}}}}`,{q});return (j.data&&j.data.Page&&j.data.Page.media)||[]}
/* TVmaze — free, no API key, for Western cartoons/animation AniList doesn't list. Returns only shows that have a poster image. */
async function tvmazeSearchList(q){
  const r=await fetch(`https://api.tvmaze.com/search/shows?q=${encodeURIComponent(q)}`);
  if(!r.ok)throw new Error("tvmaze "+r.status);
  const arr=await r.json();
  return (arr||[]).map(x=>x&&x.show).filter(s=>s&&s.image&&(s.image.original||s.image.medium)).slice(0,8);
}
/* map AniList fields to this app's own vocabulary */
function alFormatToType(f){return ({TV:"TV",TV_SHORT:"Short",MOVIE:"Movie",SPECIAL:"Special",OVA:"OVA",ONA:"ONA",MUSIC:"Short"})[f]||null}
function alCountryToKind(c){return ({JP:"anime",CN:"donghua",KR:"aeni"})[c]||null}
function alDemoFromTags(tags){if(!Array.isArray(tags))return null;
  const demo=tags.filter(t=>t&&/demograph/i.test(t.category||""));
  for(const t of demo){const d=demoOf(t.name);if(d)return d}
  for(const t of tags){const d=demoOf(t&&t.name);if(d)return d}
  return null}
function alGenresToApp(gs){const out=[];(gs||[]).forEach(g=>{const a=GENRE_ALIAS[String(g).toLowerCase()];const vals=Array.isArray(a)?a:[a||g];vals.forEach(x=>{if(x&&!out.includes(x))out.push(x)})});return out}
async function alSearchMany(list){
  const defs=[],parts=[],vars={};
  list.forEach((it,i)=>{defs.push(`$s${i}:String`);vars["s"+i]=cleanForSearch(it.title);
    parts.push(`m${i}:Media(search:$s${i},type:ANIME${it.type==="Movie"?",format:MOVIE":""}){id siteUrl seasonYear format coverImage{large}}`)});
  const j=await alQuery(`query(${defs.join(",")}){${parts.join(" ")}}`,vars);
  return list.map((_,i)=>(j.data&&j.data["m"+i])||null);
}
let postersRunning=false;
async function findPosters(src,manual){
  if(postersRunning){if(manual)toast("Already finding posters…");return}
  const todo=src.filter(x=>x&&x.id&&!x.poster&&(manual||!x.posterTried)&&!x._example).map(x=>store.items.get(x.id)||x);
  if(!todo.length){if(manual)toast("Every title already has a poster, or AniList doesn't list it.");return}
  postersRunning=true;let found=0,done=0;const B=10;
  try{
    for(let i=0;i<todo.length;i+=B){
      const batch=todo.slice(i,i+B);
      toast(`Finding posters… ${done} of ${todo.length}`);
      let res;try{res=await alSearchMany(batch)}catch(e){toast("Couldn't reach AniList for posters. Try More → Find missing posters later.");break}
      for(let k=0;k<batch.length;k++){
        const cur=store.items.get(batch[k].id);if(!cur)continue;const m=res[k];
        const yearOk=!m||!cur.year||!m.seasonYear||Math.abs(m.seasonYear-cur.year)<=3;
        const up=m&&m.coverImage&&m.coverImage.large&&yearOk?{...cur,poster:m.coverImage.large,alUrl:m.siteUrl,posterTried:false}:{...cur,posterTried:true};
        if(up.poster)found++;
        try{await store.put(up)}catch(e){}
      }
      done+=batch.length;
      if(i+B<todo.length)await sleep(2200);
    }
  }finally{postersRunning=false;store.emit();}
  const miss=done-found;
  toast(`Added ${found} poster${found===1?"":"s"}.${miss?` ${miss} not found. Open a show and tap Find poster to pick one by hand.`:""}`);
}

  /* ---- AniList character search ---- */
  function alChar(q){
    var query="query($q:String){Page(perPage:12){characters(search:$q){id gender name{full native} image{large} media(perPage:1,sort:POPULARITY_DESC){nodes{title{english romaji}}}}}}";
    return fetch("https://graphql.anilist.co",{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({query:query,variables:{q:q}})})
      .then(function(r){if(!r.ok)throw new Error("anilist "+r.status);return r.json()})
      .then(function(j){return (j.data&&j.data.Page&&j.data.Page.characters)||[]});
  }
  function alAnimeChars(q){
    var query="query($q:String){Media(search:$q,type:ANIME){title{english romaji}characters(sort:[ROLE,RELEVANCE],perPage:25){nodes{id gender name{full native} image{large}}}}}";
    return fetch("https://graphql.anilist.co",{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({query:query,variables:{q:q}})})
      .then(function(r){if(!r.ok)throw new Error("anilist "+r.status);return r.json()})
      .then(function(j){
        var M=j.data&&j.data.Media; if(!M)return [];
        var t=(M.title&&(M.title.english||M.title.romaji))||"";
        return ((M.characters&&M.characters.nodes)||[]).map(function(n){n.media={nodes:[{title:{english:t,romaji:t}}]};return n;});
      });
  }
  function fromTitle(m){var n=m&&m.media&&m.media.nodes&&m.media.nodes[0];return n?(n.title.english||n.title.romaji||""):""}
  function catFromGender(g){return g==="Female"?"girl":g==="Male"?"boy":"other"}

  /* ---- render ---- */
  function render(){
    if(!page)return;
    var body=page.querySelector("#cach-body");
    if(!body)return;
    var html="";
    /* taste chart only on a specific group (Best Girls / Best Boys / Other) — hidden on All */
    if(filter!=="all"){
      var tlabel=({girl:"Best Girls",boy:"Best Boys",other:"Other"})[filter];
      var block=tasteBlock(filter,tlabel);
      if(block) html+=block;
      else if(chars.filter(function(c){return c.cat===filter}).length){
        html+='<div class="cach-taste"><div class="cach-el">'+esc(tlabel)+' — taste type</div><p style="margin:8px 0 0">Tag your '+esc(tlabel)+' with an archetype (kuudere, tsundere, yandere…) to unlock this taste type.</p></div>';
      }
    }
    /* view toggle (ranking vs tier list) */
    if(chars.length){
      html+='<div class="cach-vtog" id="cach-vtog">'+
        '<button type="button" data-view2="ranked" aria-pressed="'+(viewMode==="ranked")+'">Ranking</button>'+
        '<button type="button" data-view2="tier" aria-pressed="'+(viewMode==="tier")+'">Tier list</button></div>';
    }

    if(viewMode==="tier" && chars.length){
      var tcats = filter==="all" ? ["girl","boy","other"] : [filter];
      var anyT=false;
      tcats.forEach(function(cat){
        var sub=chars.filter(function(c){return c.cat===cat && matchQ(c)});
        if(!sub.length)return; anyT=true;
        html+='<div class="cach-el" style="margin:18px 0 10px">'+({girl:"Best Girls",boy:"Best Boys",other:"Other"})[cat]+'</div>';
        html+=tierBoardHTML(sub);
      });
      if(!anyT)html+='<div class="cach-empty">'+(charQ?'No characters match “'+esc(charQ)+'”.':'No characters in this group yet.')+'</div>';
      body.innerHTML=html;
      return;
    }

    var list = filter==="all" ? ["girl","boy","other"] : [filter];
    var any=false;
    list.forEach(function(cat){
      var full=chars.filter(function(c){return c.cat===cat});
      var sub=full.map(function(c,idx){return {c:c,idx:idx}}).filter(function(o){return matchQ(o.c)});
      if(!sub.length)return; any=true;
      var label=({girl:"Best Girls",boy:"Best Boys",other:"Other"})[cat];
      if(filter==="all")html+='<div class="cach-el" style="margin:18px 0 10px">'+label+'</div>';
      html+='<div class="cach-grid">'+sub.map(function(o){
        var c=o.c,i=o.idx;
        return '<article class="cach-card" data-cid="'+esc(c.id)+'" title="Click to edit">'+
          '<div class="cach-port">'+(c.img?'<img src="'+esc(c.img)+'" alt="" referrerpolicy="no-referrer" onerror="this.remove()">':'')+'<span class="ini">'+esc((c.name||"?").split(" ").map(function(w){return w[0]}).join("").slice(0,2))+'</span>'+
          '<span class="cach-rank'+(i===0?" gold":"")+'">'+(i+1)+'</span>'+
          (c.tier?'<span class="cach-ar" style="top:auto;bottom:8px;left:8px;right:auto;background:'+TIER_COLOR[c.tier]+';color:#1a1020">'+c.tier+'</span>':'')+
          (c.arche?'<span class="cach-ar">'+esc(DERE_LABEL[c.arche]||"")+'</span>':'')+'</div>'+
          '<div class="cach-info"><div class="cach-nm">'+esc(c.name)+'</div><div class="cach-fr">from <b>'+esc(c.from||"—")+'</b></div>'+
          '<div class="cach-ctrl"><button data-act="up" data-id="'+c.id+'" aria-label="Move up">↑</button><button data-act="down" data-id="'+c.id+'" aria-label="Move down">↓</button><button class="del" data-act="del" data-id="'+c.id+'" aria-label="Remove">Remove</button></div>'+
          '</div></article>';
      }).join("")+'</div>';
    });
    if(!any)html+='<div class="cach-empty">'+(charQ?'No characters match “'+esc(charQ)+'”.':'No characters yet. Tap <b>+ Add character</b> to search AniList and start your ranking.')+'</div>';
    body.innerHTML=html;
  }

  /* classic S–F tier board; an "Unranked" tray collects characters with no tier */
  function tierBoardHTML(roster){
    roster = roster || chars;
    function chip(c){
      return '<div class="cach-chip" data-cid="'+esc(c.id)+'" title="Click to edit">'+
        (c.img?'<img class="cp" src="'+esc(c.img)+'" alt="" referrerpolicy="no-referrer" onerror="this.outerHTML=\'<span class=&quot;cpph&quot;>'+esc((c.name||"?").slice(0,2))+'</span>\'">':'<span class="cpph">'+esc((c.name||"?").split(" ").map(function(w){return w[0]}).join("").slice(0,2))+'</span>')+
        '<span class="cn" title="'+esc(c.name)+'">'+esc(c.name)+'</span>'+tierSel(c)+'</div>';
    }
    var h="";
    TIER_ORDER.forEach(function(k){
      var sub=roster.filter(function(c){return c.tier===k});
      h+='<div class="cach-tier"><div class="cach-tlabel" style="background:'+TIER_COLOR[k]+'">'+k+'</div>'+
         '<div class="cach-trow">'+(sub.length?sub.map(chip).join(""):'<span class="cach-tempty">Set a character to '+k+' with its tier menu</span>')+'</div></div>';
    });
    var un=roster.filter(function(c){return !c.tier});
    if(un.length) h+='<div class="cach-tier"><div class="cach-tlabel" style="background:var(--surface-2);color:var(--muted)">?</div><div class="cach-trow">'+un.map(chip).join("")+'</div></div>';
    return h;
  }

  function move(id,dir){
    var c=null,i;for(i=0;i<chars.length;i++)if(chars[i].id===id){c=chars[i];break}
    if(!c)return;
    var sub=chars.filter(function(x){return x.cat===c.cat});
    var pos=sub.indexOf(c), np=pos+dir; if(np<0||np>=sub.length)return;
    var tmp=sub[pos];sub[pos]=sub[np];sub[np]=tmp;
    var si=0;chars=chars.map(function(x){return x.cat===c.cat?sub[si++]:x});
    save();render();
  }
  function del(id){chars=chars.filter(function(c){return c.id!==id});save();render()}

        cats.map(function(c){return '<button type="button" data-cat="'+c[0]+'">'+c[1].replace("Best ","")+'</button>'}).join("")+'</div></div>'+
      '<div class="cach-field"><label>Archetype (powers your taste type)</label><div class="cach-catpick" id="cach-arche">'+
        DERE_LIST.map(function(e){var desc=e[1].split(" — ")[1]||"";return '<button type="button" data-ar="'+e[0]+'"'+(desc?' title="'+esc(desc)+'"':'')+'>'+esc(e[0]?DERE_LABEL[e[0]]:"None")+'</button>'}).join("")+'</div>'+
        '<ul class="cach-legend">'+DERE_LIST.filter(function(e){return e[0]}).map(function(e){var p=e[1].split(" — ");return '<li><b>'+esc(p[0])+'</b> — '+esc(p[1]||"")+'</li>'}).join("")+'</ul></div>'+
      '<div class="cach-field"><label>Tier (optional)</label><div class="cach-catpick" id="cach-tierpick">'+
        '<button type="button" data-tier="">None</button>'+TIER_ORDER.map(function(k){return '<button type="button" data-tier="'+k+'">'+k+'</button>'}).join("")+'</div></div>'+
      '<div class="cach-foot">'+(editing?'<button type="button" class="cach-ghost del" data-act="del" data-id="'+esc(existing.id)+'" style="color:var(--st-dropped);margin-right:auto">Remove</button>':'')+'<button type="button" class="cach-ghost" id="cach-cancel">Cancel</button><button type="button" class="cach-btn" id="cach-save">'+(editing?"Save changes":"Add character")+'</button></div>'+
      '</div>';
    document.body.appendChild(scrim);
    function close(){scrim.remove()}
    function setPressed(sel,attr,v){var bs=scrim.querySelectorAll(sel);for(var i=0;i<bs.length;i++)bs[i].setAttribute("aria-pressed",String(bs[i].getAttribute(attr)===v))}
    function setCat(v){setPressed("#cach-cat button","data-cat",v)}
    function renderPick(){
      var w=scrim.querySelector("#cach-pickwrap");
      w.innerHTML = pending ? '<div class="cach-pick">'+(pending.img?'<img src="'+esc(pending.img)+'" alt="" referrerpolicy="no-referrer" onerror="this.remove()">':'')+'<div><div class="pn">'+esc(pending.name)+'</div><div class="pf">from '+esc(pending.from||"—")+'</div></div></div>' : '';
    }
    var q=scrim.querySelector("#cach-q"), msg=scrim.querySelector("#cach-msg"), res=scrim.querySelector("#cach-res");
    function setMode(m){mode=(m==="anime"?"anime":"char");setPressed("#cach-mode button","data-mode",mode);
      q.placeholder = mode==="anime" ? "e.g. Chainsaw Man, Frieren, Attack on Titan…" : "e.g. Makima, Levi, Frieren…";
      msg.textContent = mode==="anime" ? "Type an anime title to list its characters." : "Search a character to pull their portrait and anime automatically.";
      res.innerHTML="";
    }
    /* initial selection state */
    setMode("char");
    setCat(editing?(existing.cat||"girl"):"girl");
    setPressed("#cach-arche button","data-ar",editing?(existing.arche||""):"");
    setPressed("#cach-tierpick button","data-tier",editing?(existing.tier||""):"");
    renderPick();
    scrim.addEventListener("click",function(e){
      if(e.target===scrim||e.target.closest(".cach-x")||e.target.id==="cach-cancel"){close();return}
      if(editing && e.target.closest('[data-act="del"]')){del(existing.id);close();return}
      var mb=e.target.closest("#cach-mode button"); if(mb){setMode(mb.getAttribute("data-mode"));return}
      var cb=e.target.closest("#cach-cat button"); if(cb){setCat(cb.getAttribute("data-cat"));return}
      var ab=e.target.closest("#cach-arche button"); if(ab){setPressed("#cach-arche button","data-ar",ab.getAttribute("data-ar"));return}
      var tb=e.target.closest("#cach-tierpick button"); if(tb){setPressed("#cach-tierpick button","data-tier",tb.getAttribute("data-tier"));return}
      var rb=e.target.closest("#cach-res button");
      if(rb){var bs=scrim.querySelectorAll("#cach-res button");for(var i=0;i<bs.length;i++)bs[i].setAttribute("aria-pressed","false");rb.setAttribute("aria-pressed","true");
        pending=JSON.parse(rb.getAttribute("data-c"));setCat(pending.cat);renderPick();return}
    });
    function doSearch(){
      var term=q.value.trim(); if(!term){msg.textContent="Type something to search first.";return}
      msg.textContent="Searching AniList…"; res.innerHTML="";
      var p = mode==="anime" ? alAnimeChars(term) : alChar(term);
      p.then(function(list){
        if(!list.length){msg.textContent = mode==="anime" ? "No anime found by that title. Try another spelling." : "No characters found. Try a different spelling.";return}
        msg.textContent = mode==="anime" ? "Characters in “"+term+"” — tap one:" : "Tap a character to pick them:";
        res.innerHTML=list.map(function(m){
          var obj={name:m.name.full,from:fromTitle(m),img:m.image&&m.image.large,cat:catFromGender(m.gender)};
          return '<button type="button" data-c="'+esc(JSON.stringify(obj))+'" aria-pressed="false">'+
            (obj.img?'<img class="ri" src="'+esc(obj.img)+'" alt="" referrerpolicy="no-referrer">':'<span class="ri"></span>')+
            '<span class="rn">'+esc(obj.name)+'</span><span class="rf">'+esc(obj.from||"")+'</span></button>';
        }).join("");
      }).catch(function(){msg.textContent="Couldn't reach AniList. Check your connection and try again."});
    }
    scrim.querySelector("#cach-go").addEventListener("click",doSearch);
    q.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();doSearch()}});
    scrim.querySelector("#cach-save").addEventListener("click",function(){
      if(!pending){msg.textContent="Search and pick a character first.";return}
      var catBtn=scrim.querySelector("#cach-cat button[aria-pressed=true]");
      var cat=catBtn?catBtn.getAttribute("data-cat"):"girl";
      var arBtn=scrim.querySelector("#cach-arche button[aria-pressed=true]");
      var tierBtn=scrim.querySelector("#cach-tierpick button[aria-pressed=true]");
      var arche=(arBtn&&arBtn.getAttribute("data-ar"))||null, tier=(tierBtn&&tierBtn.getAttribute("data-tier"))||"";

        for(var i=0;i<chars.length;i++)if(chars[i].id===existing.id){
          chars[i].name=pending.name;chars[i].from=pending.from;chars[i].img=pending.img||null;
          chars[i].cat=cat||"girl";chars[i].arche=arche;chars[i].tier=tier;break;
        }
      } else {
        chars.push({id:newId(),name:pending.name,from:pending.from,img:pending.img||null,cat:cat||"girl",arche:arche,tier:tier});
      }
      save();close();render();
    });
    setTimeout(function(){q.focus()},30);
  }

  /* ---- export / import ---- */
  function exportChars(){
    var blob=new Blob([JSON.stringify({app:"cel-archive-characters",version:1,items:chars},null,2)],{type:"application/json"});
    var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="cel-archive-characters.json";
    document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1000);
  }
  function importChars(file){
    var r=new FileReader();r.onload=function(){try{var j=JSON.parse(r.result);var arr=Array.isArray(j)?j:(j&&j.items);if(!Array.isArray(arr))throw 0;
      var have={};chars.forEach(function(c){have[c.id]=1});
      arr.forEach(function(c){if(c&&c.name){if(!c.id||have[c.id])c.id=newId();chars.push(c)}});
      save();render();
    }catch(e){alert && void 0;}};r.readAsText(file);
  }

  /* ---- mount ---- */
  function build(){
    styleEl();
    page.innerHTML=
      '<div class="cach-top"><div><div style="font-size:24px;font-weight:900;color:var(--ink)">Characters</div>'+
        '<div style="font-size:13px;color:var(--muted)">best girls &amp; best boys · portraits from AniList</div></div>'+
        '<span class="sp"></span>'+
        '<button type="button" class="cach-ghost" data-act="export">Export</button>'+
        '<button type="button" class="cach-ghost" data-act="import">Import</button>'+
        '<button type="button" class="cach-btn" data-act="add">+ Add character</button></div>'+
      '<div class="cach-sub" id="cach-sub">'+
        '<button type="button" class="cach-stab" data-f="all" aria-pressed="'+(filter==="all")+'">All</button>'+
        '<button type="button" class="cach-stab" data-f="girl" aria-pressed="'+(filter==="girl")+'">Best Girls</button>'+
        '<button type="button" class="cach-stab" data-f="boy" aria-pressed="'+(filter==="boy")+'">Best Boys</button>'+
        '<button type="button" class="cach-stab" data-f="other" aria-pressed="'+(filter==="other")+'">Other</button></div>'+
      '<input type="search" id="cach-search" class="cach-search" placeholder="Find a character by name or series…" value="'+esc(charQ)+'">'+
      '<input type="file" id="cach-file" accept=".json,application/json" hidden>'+
      '<div id="cach-body"></div>';
    page.addEventListener("click",function(e){
      var vt=e.target.closest("[data-view2]");
      if(vt){setView(vt.getAttribute("data-view2"));render();return}
      var db=e.target.closest("[data-dere]");
      if(db){openDerePopup(db.getAttribute("data-dcat"),db.getAttribute("data-dere"));return}
      /* click a character (card or tier chip) to edit — but not its buttons/menus */
      if(!e.target.closest("button, select, a")){
        var ce=e.target.closest("[data-cid]");
        if(ce){var cid=ce.getAttribute("data-cid"),cc=null;for(var k=0;k<chars.length;k++)if(chars[k].id===cid){cc=chars[k];break}if(cc){openModal(cc);return}}
      }
      var a=e.target.closest("[data-act]"), st=e.target.closest("[data-f]");
      if(st){filter=st.getAttribute("data-f");var bs=page.querySelectorAll("#cach-sub [data-f]");for(var i=0;i<bs.length;i++)bs[i].setAttribute("aria-pressed",String(bs[i].getAttribute("data-f")===filter));render();return}
      if(!a)return;
      var act=a.getAttribute("data-act"), id=a.getAttribute("data-id");
      if(act==="add")openAdd();
      else if(act==="export")exportChars();
      else if(act==="import")page.querySelector("#cach-file").click();
      else if(act==="up")move(id,-1);
      else if(act==="down")move(id,1);
      else if(act==="del")del(id);
    });
    page.querySelector("#cach-file").addEventListener("change",function(e){if(e.target.files&&e.target.files[0])importChars(e.target.files[0]);e.target.value=""});
    page.querySelector("#cach-search").addEventListener("input",function(e){charQ=e.target.value;render();});
    page.addEventListener("change",function(e){
      var ts=e.target.closest(".cach-tsel");
      if(ts){setTier(ts.getAttribute("data-tier-for"), ts.value);}
    });
    render();
  }

  function mount(tries){
    tries=tries||0;
    var nav=window.CelArchiveNav;
    if(nav&&nav.pages&&nav.pages.characters){page=nav.pages.characters;build();return}
    if(tries<40)return void setTimeout(function(){mount(tries+1)},100);
  }
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",function(){mount(0)});else mount(0);
})();
</script>

  function block(title, note, defs, icon, auto){
    var html='<div class="chof-sub"><span class="chof-l2">'+title+'</span><span class="chof-note">'+note+'</span></div><div class="chof-grid">';
    defs.forEach(function(d){
      if(auto){ /* auto champions: value passed directly */
        html+='<div class="chof-card"><div class="chof-medal">'+icon+'</div><div class="chof-info"><div class="chof-l">'+esc(d.l)+'</div><div class="chof-v'+(d.v?'':' ph')+'">'+esc(d.v||"—")+'</div>'+(d.s?'<div class="chof-s">'+esc(d.s)+'</div>':'')+'</div></div>';

    var d=m.startDate||{};
    if(d.year)return {sort:d.year*10+9, label:""+d.year};
    return {sort:9e9, label:"To be announced"};
  }
  function trailerUrl(t){
    if(!t||!t.id)return "";
    if(t.site==="youtube")return "https://www.youtube.com/watch?v="+t.id;
    if(t.site==="dailymotion")return "https://www.dailymotion.com/video/"+t.id;
    return "";
  }

  function styleEl(){
    if(document.getElementById("cupc-style"))return;
    var s=document.createElement("style");s.id="cupc-style";
    s.textContent=
      ".cupc-sub{display:flex;gap:7px;flex-wrap:wrap;margin:6px 0 16px}"+
      ".cupc-stab{background:var(--surface);border:1px solid var(--line);color:var(--muted);font-family:inherit;font-weight:700;font-size:12.5px;border-radius:999px;padding:6px 14px;cursor:pointer}"+
      ".cupc-stab[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}"+
      ".cupc-season{display:flex;align-items:baseline;gap:9px;font-size:16px;font-weight:900;color:var(--ink);margin:22px 0 12px;padding-bottom:7px;border-bottom:1px solid var(--line)}"+
      ".cupc-season:first-child{margin-top:2px}"+
      ".cupc-season span{font-size:12px;font-weight:700;color:var(--muted)}"+
      ".cupc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}"+
      ".cupc-pvbadge{position:absolute;right:8px;top:8px;background:var(--accent);color:var(--accent-ink);font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:999px}"+
      ".cupc-pv{display:inline-block;color:var(--accent);font-size:11.5px;font-weight:800;text-decoration:none;margin-top:2px}"+
      ".cupc-pv:hover{text-decoration:underline}"+
      ".cupc-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}"+
      ".cupc-card.marked{border-color:var(--accent)}"+
      ".cupc-pw{position:relative;display:block;aspect-ratio:2/3;background:var(--surface-2)}"+
      ".cupc-poster{width:100%;height:100%;object-fit:cover;display:block}"+
      ".cupc-rel{position:absolute;left:8px;bottom:8px;background:rgba(8,6,16,.78);color:#fff;font-size:11px;font-weight:800;letter-spacing:.02em;padding:3px 9px;border-radius:999px}"+
      ".cupc-info{padding:11px 12px 13px;display:flex;flex-direction:column;gap:4px}"+
      ".cupc-t{font-weight:800;font-size:14px;line-height:1.25;color:var(--ink);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}"+
      ".cupc-meta{font-size:11.5px;color:var(--accent);font-weight:700}"+
      ".cupc-g{font-size:11px;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}"+
      ".cupc-acts{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}"+
      ".cupc-btn{background:var(--surface-2);border:1px solid var(--line);color:var(--ink);border-radius:8px;font-family:inherit;font-weight:700;font-size:11.5px;padding:5px 9px;cursor:pointer}"+
      ".cupc-btn:hover{border-color:var(--accent)}"+
      ".cupc-btn[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}"+
      ".cupc-empty{border:1px dashed var(--line);border-radius:16px;padding:44px 22px;text-align:center;color:var(--muted)}"+
      ".cupc-empty h3{color:var(--ink);font-size:17px;margin:0 0 6px}"+
      ".cupc-empty button{margin-top:12px;background:var(--accent);color:var(--accent-ink);border:none;border-radius:10px;font-family:inherit;font-weight:800;font-size:13px;padding:8px 16px;cursor:pointer}";
    document.head.appendChild(s);
  }

  function buildLibItem(m,lid,status){
    var f=m.format, type=f==="MOVIE"?"Movie":f==="OVA"?"OVA":f==="ONA"?"ONA":f==="SPECIAL"?"Special":"TV";
    return {id:lid, title:(m.title&&(m.title.english||m.title.romaji))||"Untitled", kind:"anime", type:type,
      year:(m.seasonYear||(m.startDate&&m.startDate.year)||null), genres:(m.genres||[]).slice(),
      poster:(m.coverImage&&m.coverImage.large)||null, status:status, seasons:[], favorite:false, score:null,
      updatedAt:Date.now(), _fromUpcoming:true};
  }
  /* mirror an Upcoming mark into the main Library: Watch later -> Plan, Watching -> Watching */
  function syncLibrary(m,status){
    var L=window.CelArchiveLibrary; if(!L)return;
    var lid="al-"+m.id, libStatus = status==="watching"?"watching" : status==="later"?"plan" : null;
    var ex=L.get(lid);
    if(libStatus){
      if(ex){ ex.status=libStatus; ex.updatedAt=Date.now(); if(!ex.poster&&m.coverImage&&m.coverImage.large)ex.poster=m.coverImage.large; L.put(ex); }
      else { L.put(buildLibItem(m,lid,libStatus)); }
    } else if(ex && ex._fromUpcoming && !ex.score && !((ex.seasons||[]).some(function(s){return s.watched}))){
      L.remove(lid);  /* untick -> remove the auto-added entry, unless you've since edited it */
    }
  }
  function setMark(k,status){
    var m=null,i;
    for(i=0;i<feed.length;i++)if(String(feed[i].id)===k){m=feed[i];break}
    if(!m&&marks[k])m=marks[k].m;
    if(!m)return;
    var cleared=false;
    if(marks[k]&&marks[k].status===status){delete marks[k];cleared=true;}
    else marks[k]={status:status,m:m};
    saveMarks();
    syncLibrary(m, cleared?null:status);
    render();
  }

  function cardHTML(m){
    var k=String(m.id), mk=marks[k];
    var title=(m.title&&(m.title.english||m.title.romaji))||"Untitled";
    var img=m.coverImage&&m.coverImage.large;
    var genres=(m.genres||[]).slice(0,3).join(" · ");
    var meta=[FMT[m.format]||cap(m.format||""),(m.episodes?m.episodes+" ep":"")].filter(Boolean).join(" · ");
    var pv=trailerUrl(m.trailer);
    return '<div class="cupc-card'+(mk?" marked":"")+'">'+
      '<a class="cupc-pw" href="'+esc(m.siteUrl||"#")+'" target="_blank" rel="noopener noreferrer">'+
        (img?'<img class="cupc-poster" src="'+esc(img)+'" alt="" referrerpolicy="no-referrer" loading="lazy" onerror="this.style.display=\'none\'">':'')+
        (pv?'<span class="cupc-pvbadge">▶ PV</span>':'')+
        '<span class="cupc-rel">'+esc(rel(m))+'</span></a>'+
      '<div class="cupc-info"><div class="cupc-t" title="'+esc(title)+'">'+esc(title)+'</div>'+
        (meta?'<div class="cupc-meta">'+esc(meta)+'</div>':'')+
        (genres?'<div class="cupc-g">'+esc(genres)+'</div>':'')+
        (pv?'<a class="cupc-pv" href="'+esc(pv)+'" target="_blank" rel="noopener noreferrer">▶ Watch announcement PV</a>':'')+
        '<div class="cupc-acts">'+
          '<button type="button" class="cupc-btn" data-mark="later" data-k="'+esc(k)+'" aria-pressed="'+(mk&&mk.status==="later")+'">\u2606 Watch later</button>'+
          '<button type="button" class="cupc-btn" data-mark="watching" data-k="'+esc(k)+'" aria-pressed="'+(mk&&mk.status==="watching")+'">\u25B6 Watching</button>'+
        '</div></div></div>';
  }

  function listFor(){
    if(filter==="all")return feed;
    return Object.keys(marks).filter(function(k){return marks[k].status===filter}).map(function(k){return marks[k].m});
  }
  /* group a list into season/year sections, ordered soonest-first */
  function groupsHTML(list){
    var map={}, order=[];
    list.forEach(function(m){var bk=bucket(m);if(!map[bk.label]){map[bk.label]={sort:bk.sort,items:[]};order.push(bk.label);}map[bk.label].items.push(m);});
    order.sort(function(a,b){return map[a].sort-map[b].sort;});
    return order.map(function(lab){
      return '<div class="cupc-season">'+esc(lab)+' <span>'+map[lab].items.length+'</span></div>'+
        '<div class="cupc-grid">'+map[lab].items.map(cardHTML).join("")+'</div>';
    }).join("");
  }

  function render(){
    if(!page)return;
    var body=page.querySelector("#cupc-body");if(!body)return;
    var laterN=Object.keys(marks).filter(function(k){return marks[k].status==="later"}).length;
    var watchN=Object.keys(marks).filter(function(k){return marks[k].status==="watching"}).length;
    var html='<div class="cupc-sub">'+
      '<button type="button" class="cupc-stab" data-nf="all" aria-pressed="'+(filter==="all")+'">Upcoming</button>'+
      '<button type="button" class="cupc-stab" data-nf="later" aria-pressed="'+(filter==="later")+'">\u2606 Watch later ('+laterN+')</button>'+
      '<button type="button" class="cupc-stab" data-nf="watching" aria-pressed="'+(filter==="watching")+'">\u25B6 Watching ('+watchN+')</button></div>';
    var list=listFor();
    if(filter==="all" && !loaded && !failed){
      html+='<div class="cupc-empty"><h3>Loading upcoming anime…</h3><p>Pulling the next seasons from AniList.</p></div>';
    } else if(filter==="all" && failed){
      html+='<div class="cupc-empty"><h3>Couldn\'t reach AniList</h3><p>Check your connection and try again.</p><button type="button" data-retry>Retry</button></div>';
    } else if(!list.length){
      html+= filter==="all"
        ? '<div class="cupc-empty"><h3>Nothing upcoming right now</h3><p>AniList has no announced titles at the moment — check back soon.</p></div>'
        : '<div class="cupc-empty"><h3>Nothing saved here</h3><p>Mark an upcoming title with \u2606 Watch later or \u25B6 Watching and it shows up in this list.</p></div>';
    } else {
      html+= groupsHTML(list);
    }
    body.innerHTML=html;
  }

  function fetchUpcoming(){
    loaded=false;failed=false;render();
    var query="query($p:Int){Page(perPage:$p){media(type:ANIME,status:NOT_YET_RELEASED,sort:POPULARITY_DESC){id title{english romaji} coverImage{large} startDate{year month} season seasonYear format episodes genres siteUrl trailer{id site}}}}";
    fetch("https://graphql.anilist.co",{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({query:query,variables:{p:50}})})
      .then(function(r){if(!r.ok)throw 0;return r.json()})
      .then(function(j){feed=(j&&j.data&&j.data.Page&&j.data.Page.media)||[];loaded=true;render();})
      .catch(function(){failed=true;render();});
  }

  function build(){
    styleEl();
    page.innerHTML='<div class="canv-phead"><h2>Upcoming</h2><div class="sub">anime coming next season &amp; beyond — from AniList</div></div><div id="cupc-body"></div>';
    render();
    page.addEventListener("click",function(e){
      var nf=e.target.closest("[data-nf]");
      if(nf){filter=nf.getAttribute("data-nf");render();return}
      var mb=e.target.closest("[data-mark]");
      if(mb){setMark(mb.getAttribute("data-k"),mb.getAttribute("data-mark"));return}
      if(e.target.closest("[data-retry]")){fetchUpcoming();return}
    });
    fetchUpcoming();
  }

  function mount(tries){
    tries=tries||0;
    var nav=window.CelArchiveNav;
    if(nav&&nav.pages&&nav.pages.news){page=nav.pages.news;build();return}
    if(tries<40)return void setTimeout(function(){mount(tries+1)},100);
  }
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",function(){mount(0)});else mount(0);
})();
</script>
</body></html>
