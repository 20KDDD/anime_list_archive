<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:dark}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Cel Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=IBM+Plex+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#150C28; --surface:#1E1240; --surface-2:#2A1A4E; --ink:#F3EEFF; --muted:#9A7FD0; --line:#3A2566;
  --accent:#B8FF3C; --accent-ink:#150C28; --accent-soft:#273A17;
  --st-watching:#3DE0A0; --st-completed:#5C9BFF; --st-on_hold:#E0AE45; --st-dropped:#FF5C82; --st-plan:#9A7FD0; --st-unfinished:#C08CFF;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 26px -12px rgba(0,0,0,.7);
  --display:"Dela Gothic One","Arial Black",Impact,sans-serif;
  --body:"Zen Kaku Gothic New",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#150C28; --surface:#1E1240; --surface-2:#2A1A4E; --ink:#F3EEFF; --muted:#9A7FD0; --line:#3A2566;
  --accent:#B8FF3C; --accent-ink:#150C28; --accent-soft:#273A17;
  --st-watching:#3DE0A0; --st-completed:#5C9BFF; --st-on_hold:#E0AE45; --st-dropped:#FF5C82; --st-plan:#9A7FD0; --st-unfinished:#C08CFF;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 26px -12px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#150C28; --surface:#1E1240; --surface-2:#2A1A4E; --ink:#F3EEFF; --muted:#9A7FD0; --line:#3A2566;
  --accent:#B8FF3C; --accent-ink:#150C28; --accent-soft:#273A17;
  --st-watching:#3DE0A0; --st-completed:#5C9BFF; --st-on_hold:#E0AE45; --st-dropped:#FF5C82; --st-plan:#9A7FD0; --st-unfinished:#C08CFF;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 26px -12px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0 64px}
.wrap{max-width:1180px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* header */
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;padding-block:22px 14px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font-family:var(--display);font-weight:400;font-size:clamp(26px,5vw,36px);letter-spacing:.01em;line-height:1}
.brand .perf{display:inline-flex;gap:3px;transform:translateY(-4px)}
.brand .perf i{width:7px;height:10px;border-radius:2px;background:var(--accent)}
.brand .perf i:nth-child(2){opacity:.6}.brand .perf i:nth-child(3){opacity:.3}
.sync{font-family:var(--mono);font-size:11.5px;color:var(--muted);letter-spacing:.02em;display:flex;align-items:center;gap:6px}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.ok::before{background:var(--st-watching)}
.sync.local::before{background:var(--st-on_hold)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:500;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--st-dropped);border-color:color-mix(in srgb,var(--st-dropped) 45%,var(--line))}
.btn.danger.armed{background:var(--st-dropped);color:#fff;border-color:var(--st-dropped)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}

/* stats band */
.band{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:18px}
.stat{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.stat .v{font-family:var(--display);font-size:28px;line-height:1.15;font-variant-numeric:tabular-nums}
.stat .s{font-size:12px;color:var(--muted)}
.hist{background:var(--surface);padding:12px 16px 10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.hist .bars{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;align-items:end;height:74px}
.hist .bar{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:2px}
.hist .bar span{font-family:var(--mono);font-size:10px;color:var(--muted);line-height:1}
.hist .bar b{display:block;width:100%;border-radius:3px 3px 1px 1px;background:var(--accent);min-height:2px;opacity:.85}
.hist .bar b.zero{background:var(--line);opacity:1}
.hist .axis{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;font-family:var(--mono);font-size:10.5px;color:var(--muted);text-align:center;border-top:1px solid var(--line);padding-top:3px}
.band .hist{grid-column:1/-1}
.stat.lead .v{color:var(--accent)}
@media (max-width:1000px){.band{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.band{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* toolbar */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:500;display:inline-flex;gap:7px;align-items:center;color:var(--muted)}
.tab .n{font-family:var(--mono);font-size:11.5px}
.tab .dot{width:8px;height:8px;border-radius:50%}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab.review{border-style:dashed}
.filters{display:grid;grid-template-columns:minmax(0,2fr) repeat(3,minmax(0,1fr));gap:8px;margin-bottom:16px}
@media (max-width:700px){.filters{grid-template-columns:1fr 1fr}.filters .search{grid-column:1/-1}}
/* stats & taste collapsible */
.statsToggle{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-weight:600;font-size:13.5px;color:var(--ink);margin-bottom:14px;font-family:inherit}
.statsToggle:hover{border-color:var(--muted)}
.collapsibleStats[hidden]{display:none}
/* library: rail + grid */
.libwrap{display:flex;gap:18px;align-items:flex-start}
.rail{flex:0 0 212px;position:sticky;top:12px;display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 10px}
.railSec+.railSec{margin-top:8px}
.railLbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800;padding:8px 10px 4px}
.railItem{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:transparent;border:none;color:var(--ink);font-family:inherit;font-size:13.5px;font-weight:600;padding:8px 10px;border-radius:9px;cursor:pointer}
.railItem:hover{background:var(--surface-2)}
.railItem[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.railItem .rlabel{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.railItem .rn{font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.railItem[aria-pressed="true"] .rn{color:var(--accent-ink)}
.railItem .rdot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.libmain{flex:1;min-width:0}
@media (max-width:760px){
  .libwrap{display:block}
  .rail{position:static;flex:none;flex-direction:row;align-items:center;overflow-x:auto;gap:6px;margin-bottom:14px;scrollbar-width:none;padding:10px}
  .rail::-webkit-scrollbar{display:none}
  .railSec{display:flex;align-items:center;gap:6px;flex:0 0 auto}
  .railSec+.railSec{margin-top:0;border-left:1px solid var(--line);padding-left:8px}
  .railLbl{padding:0 2px;white-space:nowrap}
  .railItem{width:auto;flex:0 0 auto;white-space:nowrap;border:1px solid var(--line)}
  .railItem .rlabel{overflow:visible}
}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>label,.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
input[type=text],input[type=number],input[type=search],input[type=date],select,textarea{width:100%;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:14px}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
@media (max-width:560px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.ptitle{font-size:13px}}
/* poster-forward cards */
.card{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:0;display:flex;flex-direction:column;box-shadow:var(--shadow);overflow:hidden;min-width:0;cursor:pointer}
.card:hover{border-color:var(--muted)}
.card:hover .cposter,.card:hover .pfallback{transform:scale(1.04)}
.posterbox{position:relative;aspect-ratio:2/3;overflow:hidden;background:var(--surface-2)}
.pfallback{position:absolute;inset:0;transition:transform .25s ease}
.card .cposter{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s ease}
.card.noimg .cposter{display:none}
.medal{position:absolute;top:8px;right:8px;min-width:30px;height:30px;padding:0 7px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.45);border:2px solid var(--bg)}
.medal.none{background:var(--surface-2);color:var(--muted);border-color:var(--line)}
.favbtn{position:absolute;top:8px;left:8px;width:30px;height:30px;border-radius:50%;border:none;background:rgba(10,6,20,.5);color:#fff;font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer}
.favbtn[aria-pressed="true"]{color:var(--accent)}
.rvwbadge{position:absolute;left:8px;bottom:8px;font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;background:var(--st-on_hold);color:#150C28;padding:2px 7px;border-radius:999px}
.card .example-tag{top:8px;left:8px;right:auto}
.cardfoot{padding:10px 12px 12px;display:flex;flex-direction:column;gap:7px;min-width:0}
.ptitle{font-weight:700;font-size:14.5px;line-height:1.22;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cfrow{display:flex;align-items:center;gap:8px;min-width:0}
.stchip{flex:0 0 auto;font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--st) 24%,transparent);color:var(--st)}
.cmeta{flex:1;min-width:0;font-family:var(--mono);font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cfrow .plus{flex:0 0 auto;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;color:var(--ink);font-weight:800;font-size:12px;padding:3px 9px;cursor:pointer;line-height:1}
.cfrow .plus:hover{border-color:var(--accent);color:var(--accent)}
.cfrow .favbtn2{flex:0 0 auto;background:transparent;border:none;color:var(--muted);font-size:16px;line-height:1;cursor:pointer;padding:0 2px}
.cfrow .favbtn2[aria-pressed="true"]{color:var(--accent)}
/* retained (used outside the card too) */
.chip{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink)}
.flag{font-size:11.5px;padding:2px 8px;border-radius:999px;border:1px dashed var(--st-on_hold);color:var(--st-on_hold)}
.fav{color:var(--accent);font-size:15px;line-height:1}
.example-tag{position:absolute;top:10px;right:10px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:var(--accent-soft);color:var(--accent);padding:2px 6px;border-radius:4px}
.card.example{opacity:.8;border-style:dashed}
.banner{border:1px dashed var(--accent);background:var(--accent-soft);border-radius:12px;padding:12px 14px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.banner p{margin:0;max-width:70ch}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.loading{padding:60px 16px;text-align:center;color:var(--muted);font-family:var(--mono);font-size:13px}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(10,12,20,.5);z-index:50;display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:max(16px,env(safe-area-inset-top,0px)) 12px max(16px,env(safe-area-inset-bottom,0px))}
.sheet{background:var(--bg);border:1px solid var(--line);border-radius:16px;width:100%;max-width:720px;margin-block:auto;box-shadow:0 20px 60px -20px rgba(0,0,0,.5);display:flex;flex-direction:column}
.sheet.wide{max-width:1000px}
.sheet header{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.sheet header h2{font-family:var(--display);font-weight:400;font-size:20px;margin-right:auto}
.sheet .body{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.sheet .foot-bar{display:flex;flex-wrap:wrap;gap:8px;padding:14px 18px;border-top:1px solid var(--line);align-items:center}
.sheet .foot-bar .sp{margin-right:auto}
.x{border:none;background:transparent;font-size:22px;line-height:1;color:var(--muted);padding:4px 8px}
.form-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.c6{grid-column:span 6}.c3{grid-column:span 3}.c2{grid-column:span 2}
@media (max-width:560px){.c3,.c2{grid-column:span 3}}
.gpick{display:flex;flex-wrap:wrap;gap:6px}
.gpick button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12.5px}
.gpick button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.scorepick{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.scorepick button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 0;font-family:var(--mono);font-weight:500}
.scorepick button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.scorehint{font-size:12.5px;color:var(--muted);min-height:1.2em}
.check{display:inline-flex;align-items:center;gap:8px;font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.flagbox{border:1px dashed var(--st-on_hold);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.flagbox ul{margin:0;padding-left:18px;font-size:13.5px}
.help{font-size:13px;color:var(--muted);margin:0;max-width:75ch}
.help code,.raw{font-family:var(--mono);font-size:12px;background:var(--surface-2);padding:1px 5px;border-radius:4px}

/* import rows */
.irows{display:flex;flex-direction:column;gap:8px}
.irow{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:auto minmax(0,3fr) repeat(7,minmax(0,1fr));gap:8px;align-items:end}
.irow.off{opacity:.45}
.irow.flagged{border-color:color-mix(in srgb,var(--st-on_hold) 60%,var(--line))}
.irow .inc{align-self:center}
.irow .field>label{font-size:10px}
.irow input,.irow select{padding:6px 8px;font-size:13.5px}
.irow .under{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.irow .genres{grid-column:2/-1}
@media (max-width:760px){.irow{grid-template-columns:auto repeat(2,minmax(0,1fr))}.irow .tt{grid-column:2/-1}.irow .under,.irow .genres{grid-column:1/-1}}
.isum{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:13.5px}
.isum b{font-family:var(--mono)}
.progressline{height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden}
.progressline b{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}

.was{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:2px}
.seasons{display:flex;flex-wrap:wrap;gap:4px}
.seasons span{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--muted);display:inline-flex;gap:5px}
.seasons span b{color:var(--ink);font-weight:500}
.seasons span.up b{color:var(--st-watching)}.seasons span.down b{color:var(--st-dropped)}
.past{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.past ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.past li{font-size:13.5px;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:baseline}
.past li .sc{font-family:var(--display);font-size:18px;grid-row:span 2}
.past li .when{font-size:12px;color:var(--muted)}
.past li .q{grid-column:2;font-size:13px;color:var(--ink)}
.past li.now .sc{color:var(--accent)}
.shead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.shead .lbl{margin-right:auto}
.shead input{width:72px}
.slist{display:flex;flex-direction:column;gap:6px}
.srow{display:grid;grid-template-columns:80px auto 170px minmax(0,1fr) auto;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.srow .sn{font-weight:700;font-size:13.5px}
.srow select,.srow input[type=text]{padding:6px 8px;font-size:13.5px}.srow .sdel{padding:5px 8px;font-size:12px}
.srow.new{border-color:var(--accent)}
@media (max-width:520px){.srow{grid-template-columns:auto auto 1fr auto}.srow input[type=text]{grid-column:1/-1}.srow select{grid-column:1/3}}
.shint{font-size:13px;color:var(--accent);min-height:0}
details.opt summary{cursor:pointer;font-size:13px;color:var(--muted);font-weight:500}
details.opt[open] summary{margin-bottom:10px}
.taste{margin-bottom:18px;display:flex;flex-direction:column;gap:10px}
.taste .thead{display:flex;align-items:baseline;gap:10px}
.taste .thead h2{font-family:var(--display);font-weight:400;font-size:20px;margin-right:auto}
.taste .thead button{border:none;background:none;color:var(--muted);font-size:13px;padding:4px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tcard .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.tcard .v{font-family:var(--display);font-size:19px;line-height:1.2;overflow-wrap:anywhere}
.tcard .s{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.tcard.hero{border-color:var(--accent);background:linear-gradient(135deg,var(--accent-soft),var(--surface) 70%)}
.gbars{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.gbars .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;justify-content:space-between}
.grow{display:grid;grid-template-columns:minmax(80px,120px) 1fr auto auto;gap:10px;align-items:center;border:none;background:none;padding:2px 0;text-align:left;font-size:13.5px}
.grow:hover .gname{text-decoration:underline}
.grow .gtrack{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.grow .gtrack b{display:block;height:100%;background:var(--accent);border-radius:5px}
.grow .gn{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:24px;text-align:right}

<script>
(function(){
"use strict";

/* ---------- vocabulary ---------- */
const STATUSES=[
  {k:"watching",label:"Watching"},
  {k:"completed",label:"Completed"},
  {k:"unfinished",label:"Unfinished"},
  {k:"on_hold",label:"On hold"},
  {k:"dropped",label:"Dropped"},
  {k:"plan",label:"Plan to watch"}];
const ST_LABEL=Object.fromEntries(STATUSES.map(s=>[s.k,s.label]));
const KINDS=[
  {k:"anime",label:"Anime"},
  {k:"donghua",label:"Donghua (dongman)"},
  {k:"cartoon",label:"Cartoon"},
  {k:"aeni",label:"Aeni (Korean)"},
  {k:"other",label:"Other animation"}];
const KIND_LABEL=Object.fromEntries(KINDS.map(s=>[s.k,s.label]));
const TYPES=["TV","Movie","OVA","ONA","Special","Short","Web series"];
const GENRES=["Action","Adventure","Comedy","Drama","Fantasy","Romance","Sci-Fi","Slice of Life","Mystery","Horror","Thriller","Psychological","Supernatural","Sports","Mecha","Music","Isekai","Historical","Martial Arts","Military","School","Space","Detective","Vampire","Parody","Family","Kids","Harem","Ecchi","Iyashikei","Mahou Shoujo","Idol","Yuri","Yaoi (BL)","Gore","Cultivation","Wuxia","Xianxia"];
const GENRE_ALIAS={"sci fi":"Sci-Fi","scifi":"Sci-Fi","science fiction":"Sci-Fi","sol":"Slice of Life","slice-of-life":"Slice of Life","romcom":["Romance","Comedy"],"rom com":["Romance","Comedy"],"rom-com":["Romance","Comedy"],"psych":"Psychological","sport":"Sports","martial art":"Martial Arts","romantic":"Romance","funny":"Comedy","scary":"Horror","mech":"Mecha","robots":"Mecha","magic":"Fantasy","superpower":"Supernatural","super power":"Supernatural","magical girl":"Mahou Shoujo","mahou shojo":"Mahou Shoujo","healing":"Iyashikei","bl":"Yaoi (BL)","boys love":"Yaoi (BL)","boys' love":"Yaoi (BL)","yaoi":"Yaoi (BL)","shounen-ai":"Yaoi (BL)","shonen-ai":"Yaoi (BL)","gl":"Yuri","girls love":"Yuri","girls' love":"Yuri","shoujo-ai":"Yuri","shojo-ai":"Yuri","idols":"Idol","gory":"Gore","reverse harem":"Harem"};
GENRES.forEach(g=>{GENRE_ALIAS[g.toLowerCase()]=g});
const DEMOS=[{k:"shounen",label:"Shounen"},{k:"seinen",label:"Seinen"},{k:"shoujo",label:"Shoujo"},{k:"josei",label:"Josei"},{k:"kodomo",label:"Kids (Kodomo)"},{k:"general",label:"General / all ages"}];
const DEMO_LABEL=Object.fromEntries(DEMOS.map(d=>[d.k,d.label]));
function demoOf(v){const t=String(v||"").toLowerCase().trim();if(!t)return null;
  if(/^sh[oō]u?nen$/.test(t))return "shounen";if(t==="seinen")return "seinen";if(/^sh[oō]u?jo$/.test(t))return "shoujo";if(t==="josei")return "josei";
  if(/^(kodomo|kids?|children)/.test(t))return "kodomo";if(/^(general|all ages|everyone|family)/.test(t))return "general";return null}
const SCORE_LABEL={10:"Masterpiece",9:"Great",8:"Very good",7:"Good",6:"Fine",5:"Average",4:"Bad",3:"Very bad",2:"Horrible",1:"Appalling"};

const EXAMPLES=[
  {id:"ex1",title:"Attack on Titan",kind:"anime",demo:"shounen",type:"TV",year:2013,status:"completed",score:9,genres:["Action","Drama"],seasons:[{n:1,watched:true},{n:2,watched:true,effect:-1,note:"Dragged a bit"},{n:3,watched:true,effect:1},{n:4,watched:true,effect:1}],scoreHistory:[{score:8,date:1614600000000,note:"Great but slow start"}],scoreReason:"The final season changed everything",watchedYear:2023,favorite:true,updatedAt:3},
  {id:"ex2",title:"Mo Dao Zu Shi",altTitle:"The Founder of Diabolism",kind:"donghua",type:"ONA",year:2018,status:"watching",score:9,genres:["Fantasy","Xianxia"],seasons:[{n:1,watched:true},{n:2,watched:true,effect:1},{n:3,watched:false}],updatedAt:2},
  {id:"ex3",title:"Avatar: The Last Airbender",kind:"cartoon",type:"TV",year:2005,status:"completed",score:10,genres:["Adventure","Fantasy","Martial Arts"],seasons:[{n:1,watched:true},{n:2,watched:true},{n:3,watched:true}],watchedYear:2012,updatedAt:1}];

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const norm=t=>String(t||"").toLowerCase().normalize("NFKD").replace(/[^\p{L}\p{N}]+/gu,"");
const newId=()=>"t"+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const isMovie=it=>!!it&&it.type==="Movie";
function seasonsOf(it){return it&&Array.isArray(it.seasons)?it.seasons:[]}
function fmtDate(t){if(!t)return "";try{return new Date(t).toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"})}catch(e){return ""}}
const toInt=v=>{const n=parseInt(v,10);return Number.isFinite(n)?n:null};
/* scores live on a 1–10 scale; coerce anything else into range (18 -> 10) or null */
const safeScore=s=>{if(s==null||s==="")return null;const n=Math.round(Number(s));return Number.isFinite(n)&&n>=1?Math.min(10,n):null};
let toastTimer;
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,3200)}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* ---------- storage ---------- */
const LS_KEY="celarchive.items.v1";
const store={
  mode:"loading",col:null,items:new Map(),listeners:[],
  async init(){
    let db=null;
    try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
    if(db){
      this.mode="cloud";this.col=db.collection("titles");
      this.col.onSnapshot(snap=>{
        const m=new Map();snap.docs.forEach(d=>{const v=d.data();if(v)m.set(d.id,{...v,id:d.id})});
        this.items=m;this.emit();
      },err=>{
        toast("Lost connection to your saved library. Reload the page to reconnect.");
        setSync("local","Connection lost");
      });
    }else{
      this.mode="local";
      try{const raw=lsGet(LS_KEY);const arr=raw?JSON.parse(raw):[];let fixed=0;
        arr.forEach(x=>{
          if(x&&"score"in x){const sc=safeScore(x.score);if(sc!==x.score){x.score=sc;fixed++}}
          if(x&&Array.isArray(x.scoreHistory))x.scoreHistory.forEach(h=>{if(h&&"score"in h){const sc=safeScore(h.score);if(sc!==h.score){h.score=sc;fixed++}}});
          this.items.set(x.id,x);
        });
        if(fixed)lsSet(LS_KEY,JSON.stringify([...this.items.values()]));
      }catch(e){}
      this.emit();
    }
  },
  persistLocal(){clearTimeout(this._pt);this._pt=setTimeout(()=>this.flush(),150)},
  flush(){clearTimeout(this._pt);this._pt=null;if(this.mode==="local")lsSet(LS_KEY,JSON.stringify([...this.items.values()]))},
  async put(item){
    const clean=JSON.parse(JSON.stringify(item));
    if(this.mode==="cloud"){await this.col.doc(item.id).set(clean)}
    else{this.items.set(item.id,clean);this.persistLocal();this.emit()}
  },
  async remove(id){
    if(this.mode==="cloud"){await this.col.doc(id).delete()}
    else{this.items.delete(id);this.persistLocal();this.emit()}
  },
  onChange(fn){this.listeners.push(fn)},
  emit(){this.loaded=true;if(this._et)return;this._et=setTimeout(()=>{this._et=null;this.listeners.forEach(f=>f())},40)}
};
async function withRetry(fn){
  for(let a=0;;a++){
    try{return await fn()}catch(e){
      const c=e&&e.code;
      if((c==="resource_exhausted"||c==="unavailable")&&a<6){await sleep(500*2**a+Math.random()*400);continue}
      throw e;
    }
  }
}
async function writeMany(list,onProgress,conc){
  let i=0,done=0,failed=[];
  const worker=async()=>{while(i<list.length){const it=list[i++];try{await withRetry(()=>store.put(it))}catch(e){failed.push({it,e})}onProgress&&onProgress(++done,list.length)}};
  await Promise.all(Array.from({length:Math.min(conc||4,list.length||1)},worker));
  return failed;
}
function errMsg(e){
  const c=e&&e.code;
  if(c==="quota_exceeded")return "Your library is full (5,000 titles). Delete some entries to add more.";
  if(c==="invalid_argument")return "This view can’t save changes. Open the page signed in as its owner.";
  return "Couldn’t save that change. Check your connection and try again.";
}
function setSync(cls,txt){const s=$("#sync");s.className="sync "+cls;s.textContent=txt}

/* ---------- state + filters ---------- */
const state={status:"all",q:"",kind:"",format:"",genre:"",demo:"",sort:lsGet("celarchive.sort")||"updated"};
$("#fsort").value=state.sort;

function items(){return [...store.items.values()]}
function isExampleMode(){return store.loaded&&store.items.size===0}
function viewItems(){
  let list=isExampleMode()?EXAMPLES.map(x=>({...x,_example:true})):items();
  const q=state.q.trim().toLowerCase();
  list=list.filter(it=>{
    if(state.status==="review"){if(!it.needsReview)return false}
    else if(state.status==="fav"){if(!it.favorite)return false}
    else if(state.status!=="all"&&it.status!==state.status)return false;
    if(state.kind&&it.kind!==state.kind)return false;
    if(state.format==="film"&&!isMovie(it))return false;
    if(state.format==="tv"&&isMovie(it))return false;
    if(state.genre&&!(it.genres||[]).includes(state.genre))return false;
    if(state.demo&&it.demo!==state.demo)return false;
    if(q){const hay=[DEMO_LABEL[it.demo],it.title,it.altTitle,it.notes,(it.genres||[]).join(" "),it.year,KIND_LABEL[it.kind]].join(" ").toLowerCase();if(!hay.includes(q))return false}
    return true;
  });
  const by={
    updated:(a,b)=>(b.updatedAt||0)-(a.updatedAt||0),
    title:(a,b)=>String(a.title).localeCompare(String(b.title),undefined,{sensitivity:"base"}),
    score:(a,b)=>(b.score||0)-(a.score||0)||String(a.title).localeCompare(b.title),
    year_desc:(a,b)=>(b.year||0)-(a.year||0),
    year_asc:(a,b)=>(a.year||9999)-(b.year||9999),
    watched:(a,b)=>(b.watchedYear||0)-(a.watchedYear||0)||(b.updatedAt||0)-(a.updatedAt||0)};
  return list.sort(by[state.sort]||by.updated);
}

/* ---------- render ---------- */
/* ---------- counting mode: franchise (original) vs MAL style ---------- */
function countMode(){return lsGet("celarchive.countMode")==="mal"?"mal":"franchise"}
function malStatusOf(fr){return ({completed:"completed",watching:"watching",plan:"plan",on_hold:"on_hold",unfinished:"on_hold",dropped:"dropped"})[fr]||"plan"}
/* turn franchise titles into MAL-style entries: each season/OVA/movie is its own entry */
function malEntries(src){
  const out=[];
  src.forEach(it=>{
    const ss=seasonsOf(it),sc=it.score||null;
    if(isMovie(it)||!ss.length){out.push({status:malStatusOf(it.status),score:sc});return}
    let hit=false;
    ss.forEach(s=>{
      if(s.watched){out.push({status:"completed",score:sc});return}
      let st;
      if(it.status==="watching"){st=hit?"plan":"watching";hit=true}
      else if(it.status==="dropped"){st=hit?"plan":"dropped";hit=true}
      else if(it.status==="unfinished"||it.status==="on_hold"){st="on_hold"}
      else if(it.status==="completed"){st="completed"}
      else{st="plan"}
      out.push({status:st,score:sc});
    });
  });
  return out;
}
function renderBandMal(src){
  const E=malEntries(src);
  const ST=[["watching","Watching"],["completed","Completed"],["on_hold","On-Hold"],["dropped","Dropped"],["plan","Plan to Watch"]];
  const cnt=Object.fromEntries(ST.map(([k])=>[k,E.filter(e=>e.status===k).length]));
  const scoredE=E.filter(e=>e.score&&e.status!=="plan");
  const mean=scoredE.length?scoredE.reduce((a,b)=>a+b.score,0)/scoredE.length:null;
  const counts=Array.from({length:10},(_,i)=>scoredE.filter(e=>Math.round(e.score)===i+1).length);
  const max=Math.max(1,...counts);
  const total=E.length;
  const tile=(k,v,sub,cls)=>`<div class="stat${cls?" "+cls:""}"><span class="k">${k}</span><span class="v">${v}</span><span class="s">${sub}</span></div>`;
  const seg=ST.map(([k,l])=>cnt[k]?`<span class="malseg" style="flex:${cnt[k]};background:var(--st-${k})" title="${l}: ${cnt[k]}"></span>`:"").join("");
  const legend=ST.map(([k,l])=>`<span class="mallg"><i style="background:var(--st-${k})"></i>${l} <b>${cnt[k]}</b></span>`).join("");
  $("#band").innerHTML=
    tile("Total entries",total,`across ${src.length} series · each season counts`,"lead")+
    tile("Mean score",mean?mean.toFixed(2):"—",`${scoredE.length} scored entr${scoredE.length===1?"y":"ies"}`,"lead")+
    tile("Completed",cnt.completed,"entries finished")+
    tile("Watching",cnt.watching,"in progress")+
    tile("On-Hold",cnt.on_hold,"paused or unfinished")+
    tile("Dropped · Plan",cnt.dropped+" · "+cnt.plan,"dropped · planned")+
    `<div class="hist" style="grid-column:1/-1">
      <span class="k lbl" style="display:flex;justify-content:space-between;gap:8px"><span>Status breakdown</span><span>${total} entr${total===1?"y":"ies"}</span></span>
      <div class="malbar">${seg||'<span class="malseg" style="flex:1;background:var(--surface-2)"></span>'}</div>
      <div class="mallegend">${legend}</div>
    </div>`+
    `<div class="hist" style="grid-column:1/-1" aria-label="Score distribution">
      <span class="k lbl" style="display:flex;justify-content:space-between;gap:8px"><span>Score distribution (per entry)</span><span>${mean?"mean "+mean.toFixed(2):""}</span></span>
      <div class="bars">${counts.map(c=>`<div class="bar" title="${c} entr${c===1?"y":"ies"}"><span>${c||""}</span><b class="${c?"":"zero"}" style="height:${c?Math.max(4,c/max*58):2}px"></b></div>`).join("")}</div>
      <div class="axis">${counts.map((_,i)=>`<span>${i+1}</span>`).join("")}</div>
    </div>`;
}
function renderBand(){

function openSheet(html,wide){
  const slot=$("#sheetSlot");
  slot.innerHTML=`<div class="scrim" id="scrim"><div class="sheet${wide?" wide":""}" role="dialog" aria-modal="true">${html}</div></div>`;
  const scrim=$("#scrim");
  scrim.addEventListener("mousedown",e=>{if(e.target===scrim)closeSheet()});
  slot.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeSheet);
  document.body.style.overflow="hidden";
  setTimeout(()=>{const f=slot.querySelector("[autofocus]");if(f)f.focus()},30);
  return slot.querySelector(".sheet");
}
