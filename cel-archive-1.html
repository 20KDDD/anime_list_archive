<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Cel Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=IBM+Plex+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#EDEFE8; --surface:#FAFBF6; --surface-2:#E3E6DD; --ink:#171A28; --muted:#5B6070; --line:#CFD3C8;
  --accent:#D3305A; --accent-ink:#FFFFFF; --accent-soft:#F7D9E1;
  --st-watching:#23805A; --st-completed:#2C5FB3; --st-on_hold:#B07D12; --st-dropped:#A83246; --st-plan:#6A6E7C; --st-unfinished:#7A4FB5;
  --shadow:0 1px 0 rgba(23,26,40,.06),0 6px 18px -10px rgba(23,26,40,.25);
  --display:"Dela Gothic One","Arial Black",Impact,sans-serif;
  --body:"Zen Kaku Gothic New",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#11131B; --surface:#1A1D28; --surface-2:#232736; --ink:#ECEEF4; --muted:#9BA1B4; --line:#2E3345;
  --accent:#FF5C82; --accent-ink:#1A0B10; --accent-soft:#3A1B26;
  --st-watching:#4CC38E; --st-completed:#6F9BF0; --st-on_hold:#E0AE45; --st-dropped:#F07086; --st-plan:#A0A5B5; --st-unfinished:#B08CF0;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 22px -12px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11131B; --surface:#1A1D28; --surface-2:#232736; --ink:#ECEEF4; --muted:#9BA1B4; --line:#2E3345;
  --accent:#FF5C82; --accent-ink:#1A0B10; --accent-soft:#3A1B26;
  --st-watching:#4CC38E; --st-completed:#6F9BF0; --st-on_hold:#E0AE45; --st-dropped:#F07086; --st-plan:#A0A5B5; --st-unfinished:#B08CF0;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 22px -12px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0 64px}
.wrap{max-width:1180px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* header */
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;padding-block:22px 14px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font-family:var(--display);font-weight:400;font-size:clamp(26px,5vw,36px);letter-spacing:.01em;line-height:1}
.brand .perf{display:inline-flex;gap:3px;transform:translateY(-4px)}
.brand .perf i{width:7px;height:10px;border-radius:2px;background:var(--accent)}
.brand .perf i:nth-child(2){opacity:.6}.brand .perf i:nth-child(3){opacity:.3}
.sync{font-family:var(--mono);font-size:11.5px;color:var(--muted);letter-spacing:.02em;display:flex;align-items:center;gap:6px}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.ok::before{background:var(--st-watching)}
.sync.local::before{background:var(--st-on_hold)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:500;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--st-dropped);border-color:color-mix(in srgb,var(--st-dropped) 45%,var(--line))}
.btn.danger.armed{background:var(--st-dropped);color:#fff;border-color:var(--st-dropped)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}

/* stats band */
.band{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) minmax(0,1.6fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:18px}
.stat{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.stat .v{font-family:var(--display);font-size:28px;line-height:1.15;font-variant-numeric:tabular-nums}
.stat .s{font-size:12px;color:var(--muted)}
.hist{background:var(--surface);padding:12px 16px 10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.hist .bars{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;align-items:end;height:74px}
.hist .bar{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:2px}
.hist .bar span{font-family:var(--mono);font-size:10px;color:var(--muted);line-height:1}
.hist .bar b{display:block;width:100%;border-radius:3px 3px 1px 1px;background:var(--accent);min-height:2px;opacity:.85}
.hist .bar b.zero{background:var(--line);opacity:1}
.hist .axis{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;font-family:var(--mono);font-size:10.5px;color:var(--muted);text-align:center;border-top:1px solid var(--line);padding-top:3px}
@media (max-width:860px){.band{grid-template-columns:repeat(2,minmax(0,1fr))}.hist{grid-column:1/-1}}

/* toolbar */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:500;display:inline-flex;gap:7px;align-items:center;color:var(--muted)}
.tab .n{font-family:var(--mono);font-size:11.5px}
.tab .dot{width:8px;height:8px;border-radius:50%}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab.review{border-style:dashed}
.filters{display:grid;grid-template-columns:minmax(0,2fr) repeat(4,minmax(0,1fr));gap:8px;margin-bottom:16px}
@media (max-width:700px){.filters{grid-template-columns:1fr 1fr}.filters .search{grid-column:1/-1}}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>label,.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
input[type=text],input[type=number],input[type=search],input[type=date],select,textarea{width:100%;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:14px}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.card{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px 20px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);overflow:hidden;min-width:0}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--st,var(--line))}
.card:hover{border-color:var(--muted)}
.card .meta{font-family:var(--mono);font-size:11.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px}
.card .row1{display:flex;gap:10px;align-items:flex-start}
.card .ttl{flex:1;min-width:0}
.card h3{font-size:16.5px;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.card .alt{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.score{flex:0 0 auto;text-align:center;min-width:48px}
.score .num{font-family:var(--display);font-size:26px;line-height:1}
.score .lab{font-size:10px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.score.none .num{color:var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink)}
.flag{font-size:11.5px;padding:2px 8px;border-radius:999px;border:1px dashed var(--st-on_hold);color:var(--st-on_hold)}
.foot{display:flex;align-items:center;gap:10px;margin-top:auto;padding-top:4px}
.pill{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;color:var(--st);background:color-mix(in srgb,var(--st) 14%,transparent);white-space:nowrap}
.prog{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
.prog .track{flex:1;height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.prog .track b{display:block;height:100%;background:var(--st)}
.prog .t{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
.plus{border:1px solid var(--line);background:var(--surface);border-radius:8px;font-family:var(--mono);font-size:12px;padding:2px 8px}
.fav{color:var(--accent);font-size:15px;line-height:1}
.example-tag{position:absolute;top:10px;right:10px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:var(--accent-soft);color:var(--accent);padding:2px 6px;border-radius:4px}
.card.example{opacity:.8;border-style:dashed}
.banner{border:1px dashed var(--accent);background:var(--accent-soft);border-radius:12px;padding:12px 14px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.banner p{margin:0;max-width:70ch}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.loading{padding:60px 16px;text-align:center;color:var(--muted);font-family:var(--mono);font-size:13px}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(10,12,20,.5);z-index:50;display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:max(16px,env(safe-area-inset-top,0px)) 12px max(16px,env(safe-area-inset-bottom,0px))}
.sheet{background:var(--bg);border:1px solid var(--line);border-radius:16px;width:100%;max-width:720px;margin-block:auto;box-shadow:0 20px 60px -20px rgba(0,0,0,.5);display:flex;flex-direction:column}
.sheet.wide{max-width:1000px}
.sheet header{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.sheet header h2{font-family:var(--display);font-weight:400;font-size:20px;margin-right:auto}
.sheet .body{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.sheet .foot-bar{display:flex;flex-wrap:wrap;gap:8px;padding:14px 18px;border-top:1px solid var(--line);align-items:center}
.sheet .foot-bar .sp{margin-right:auto}
.x{border:none;background:transparent;font-size:22px;line-height:1;color:var(--muted);padding:4px 8px}
.form-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.c6{grid-column:span 6}.c3{grid-column:span 3}.c2{grid-column:span 2}
@media (max-width:560px){.c3,.c2{grid-column:span 3}}
.gpick{display:flex;flex-wrap:wrap;gap:6px}
.gpick button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12.5px}
.gpick button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.scorepick{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.scorepick button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 0;font-family:var(--mono);font-weight:500}
.scorepick button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.scorehint{font-size:12.5px;color:var(--muted);min-height:1.2em}
.check{display:inline-flex;align-items:center;gap:8px;font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.flagbox{border:1px dashed var(--st-on_hold);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.flagbox ul{margin:0;padding-left:18px;font-size:13.5px}
.help{font-size:13px;color:var(--muted);margin:0;max-width:75ch}
.help code,.raw{font-family:var(--mono);font-size:12px;background:var(--surface-2);padding:1px 5px;border-radius:4px}

/* import rows */
.irows{display:flex;flex-direction:column;gap:8px}
.irow{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:auto minmax(0,3fr) repeat(7,minmax(0,1fr));gap:8px;align-items:end}
.irow.off{opacity:.45}
.irow.flagged{border-color:color-mix(in srgb,var(--st-on_hold) 60%,var(--line))}
.irow .inc{align-self:center}
.irow .field>label{font-size:10px}
.irow input,.irow select{padding:6px 8px;font-size:13.5px}
.irow .under{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.irow .genres{grid-column:2/-1}
@media (max-width:760px){.irow{grid-template-columns:auto repeat(2,minmax(0,1fr))}.irow .tt{grid-column:2/-1}.irow .under,.irow .genres{grid-column:1/-1}}
.isum{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:13.5px}
.isum b{font-family:var(--mono)}
.progressline{height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden}
.progressline b{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}

.was{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:2px}
.seasons{display:flex;flex-wrap:wrap;gap:4px}
.seasons span{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--muted);display:inline-flex;gap:5px}
.seasons span b{color:var(--ink);font-weight:500}
.seasons span.up b{color:var(--st-watching)}.seasons span.down b{color:var(--st-dropped)}
.past{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.past ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.past li{font-size:13.5px;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:baseline}
.past li .sc{font-family:var(--display);font-size:18px;grid-row:span 2}
.past li .when{font-size:12px;color:var(--muted)}
.past li .q{grid-column:2;font-size:13px;color:var(--ink)}
.past li.now .sc{color:var(--accent)}
.shead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.shead .lbl{margin-right:auto}
.shead input{width:72px}
.slist{display:flex;flex-direction:column;gap:6px}
.srow{display:grid;grid-template-columns:80px auto 170px minmax(0,1fr);gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.srow .sn{font-weight:700;font-size:13.5px}
.srow select,.srow input[type=text]{padding:6px 8px;font-size:13.5px}
.srow.new{border-color:var(--accent)}
@media (max-width:520px){.srow{grid-template-columns:auto auto 1fr}.srow input[type=text]{grid-column:1/-1}}
.shint{font-size:13px;color:var(--accent);min-height:0}
details.opt summary{cursor:pointer;font-size:13px;color:var(--muted);font-weight:500}
details.opt[open] summary{margin-bottom:10px}
.taste{margin-bottom:18px;display:flex;flex-direction:column;gap:10px}
.taste .thead{display:flex;align-items:baseline;gap:10px}
.taste .thead h2{font-family:var(--display);font-weight:400;font-size:20px;margin-right:auto}
.taste .thead button{border:none;background:none;color:var(--muted);font-size:13px;padding:4px}
.tcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tcard .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.tcard .v{font-family:var(--display);font-size:21px;line-height:1.2;overflow-wrap:anywhere}
.tcard .s{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.tcard.hero{border-color:var(--accent);background:linear-gradient(135deg,var(--accent-soft),var(--surface) 70%)}
.gbars{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.gbars .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;justify-content:space-between}
.grow{display:grid;grid-template-columns:minmax(80px,120px) 1fr auto auto;gap:10px;align-items:center;border:none;background:none;padding:2px 0;text-align:left;font-size:13.5px}
.grow:hover .gname{text-decoration:underline}
.grow .gtrack{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.grow .gtrack b{display:block;height:100%;background:var(--accent);border-radius:5px}
.grow .gn{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:24px;text-align:right}
.grow .ga{font-family:var(--mono);font-size:12px;min-width:34px;text-align:right}
.gl-sec{display:flex;flex-direction:column;gap:8px}
.gl-sec h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-top:4px}
.gl-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;margin:0}
.gl-item{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:3px}
.gl-item dt{font-weight:700;font-size:14.5px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.gl-item dt small{font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:400}
.gl-item dd{margin:0;font-size:13.5px;color:var(--muted);line-height:1.45}
.gl-item dd i{color:var(--ink);font-style:normal}
.gl-item.hit{border-color:var(--accent)}
.linkbtn{border:none;background:none;color:var(--accent);font-size:13px;padding:4px;text-decoration:underline;text-underline-offset:2px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:80;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.menu{position:relative}
.menu .pop{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column;min-width:220px;z-index:30}
.menu .pop button{border:none;background:transparent;text-align:left;padding:9px 10px;border-radius:8px;font-size:14px}
.menu .pop button:hover{background:var(--surface-2)}
.menu .pop hr{border:none;border-top:1px solid var(--line);margin:4px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head><body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="perf" aria-hidden="true"><i></i><i></i><i></i></span>
      <h1>Cel Archive</h1>
    </div>
    <span class="sync" id="sync">Connecting…</span>
    <div class="actions">
      <button class="btn primary" id="btnAdd">+ Add title</button>
      <button class="btn" id="btnBulk">Bulk import</button>
      <button class="btn" id="btnXlsx">Share as Excel</button>
      <button class="btn ghost" id="btnTerms">Terms</button>
      <div class="menu">
        <button class="btn ghost" id="btnMenu" aria-haspopup="true" aria-expanded="false">More ▾</button>
        <div class="pop" id="menuPop" hidden>
          <button id="mExportJson">Download backup (.json)</button>
          <button id="mExportCsv">Download spreadsheet (.csv)</button>
          <button id="mImportJson">Restore from backup…</button>
          <hr>
          <button id="mDeleteAll" style="color:var(--st-dropped)">Delete entire library…</button>
        </div>
      </div>
    </div>
  </header>

  <section class="band" id="band" aria-label="Library summary"></section>
  <section class="taste" id="taste" aria-label="Your taste"></section>

  <div class="tabs" id="tabs" role="toolbar" aria-label="Filter by status"></div>
  <div class="filters">
    <div class="field search"><label for="fq">Search</label><input type="search" id="fq" placeholder="Title, notes, genre…"></div>
    <div class="field"><label for="fkind">Kind</label><select id="fkind"></select></div>
    <div class="field"><label for="fgenre">Genre</label><select id="fgenre"></select></div>
    <div class="field"><label for="fdemo">Demographic</label><select id="fdemo"></select></div>
    <div class="field"><label for="fsort">Sort</label><select id="fsort">
      <option value="updated">Recently updated</option>
      <option value="title">Title A–Z</option>
      <option value="score">Score, high to low</option>
      <option value="year_desc">Release year, newest</option>
      <option value="year_asc">Release year, oldest</option>
      <option value="watched">Year watched, newest</option>
    </select></div>
  </div>

  <div id="bannerSlot"></div>
  <div id="grid" class="grid"></div>
  <div id="emptySlot"></div>
</div>

<div id="sheetSlot"></div>
<input type="file" id="fileText" accept=".txt,.csv,.tsv,.md,text/plain,text/csv" hidden>
<input type="file" id="fileJson" accept=".json,application/json" hidden>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
"use strict";

/* ---------- vocabulary ---------- */
const STATUSES=[
  {k:"watching",label:"Watching"},
  {k:"completed",label:"Completed"},
  {k:"unfinished",label:"Unfinished"},
  {k:"on_hold",label:"On hold"},
  {k:"dropped",label:"Dropped"},
  {k:"plan",label:"Plan to watch"}];
const ST_LABEL=Object.fromEntries(STATUSES.map(s=>[s.k,s.label]));
const KINDS=[
  {k:"anime",label:"Anime"},
  {k:"donghua",label:"Donghua (dongman)"},
  {k:"cartoon",label:"Cartoon"},
  {k:"aeni",label:"Aeni (Korean)"},
  {k:"other",label:"Other animation"}];
const KIND_LABEL=Object.fromEntries(KINDS.map(s=>[s.k,s.label]));
const TYPES=["TV","Movie","OVA","ONA","Special","Short","Web series"];
const GENRES=["Action","Adventure","Comedy","Drama","Fantasy","Romance","Sci-Fi","Slice of Life","Mystery","Horror","Thriller","Psychological","Supernatural","Sports","Mecha","Music","Isekai","Historical","Martial Arts","Military","School","Space","Detective","Vampire","Parody","Family","Kids","Harem","Ecchi","Iyashikei","Mahou Shoujo","Idol","Yuri","Yaoi (BL)","Gore","Cultivation","Wuxia","Xianxia"];
const GENRE_ALIAS={"sci fi":"Sci-Fi","scifi":"Sci-Fi","science fiction":"Sci-Fi","sol":"Slice of Life","slice-of-life":"Slice of Life","romcom":["Romance","Comedy"],"rom com":["Romance","Comedy"],"rom-com":["Romance","Comedy"],"psych":"Psychological","sport":"Sports","martial art":"Martial Arts","romantic":"Romance","funny":"Comedy","scary":"Horror","mech":"Mecha","robots":"Mecha","magic":"Fantasy","superpower":"Supernatural","super power":"Supernatural","magical girl":"Mahou Shoujo","mahou shojo":"Mahou Shoujo","healing":"Iyashikei","bl":"Yaoi (BL)","boys love":"Yaoi (BL)","boys' love":"Yaoi (BL)","yaoi":"Yaoi (BL)","shounen-ai":"Yaoi (BL)","shonen-ai":"Yaoi (BL)","gl":"Yuri","girls love":"Yuri","girls' love":"Yuri","shoujo-ai":"Yuri","shojo-ai":"Yuri","idols":"Idol","gory":"Gore","reverse harem":"Harem"};
GENRES.forEach(g=>{GENRE_ALIAS[g.toLowerCase()]=g});
const DEMOS=[{k:"shounen",label:"Shounen"},{k:"seinen",label:"Seinen"},{k:"shoujo",label:"Shoujo"},{k:"josei",label:"Josei"},{k:"kodomo",label:"Kids (Kodomo)"},{k:"general",label:"General / all ages"}];
const DEMO_LABEL=Object.fromEntries(DEMOS.map(d=>[d.k,d.label]));
function demoOf(v){const t=String(v||"").toLowerCase().trim();if(!t)return null;
  if(/^sh[oō]u?nen$/.test(t))return "shounen";if(t==="seinen")return "seinen";if(/^sh[oō]u?jo$/.test(t))return "shoujo";if(t==="josei")return "josei";
  if(/^(kodomo|kids?|children)/.test(t))return "kodomo";if(/^(general|all ages|everyone|family)/.test(t))return "general";return null}
const SCORE_LABEL={10:"Masterpiece",9:"Great",8:"Very good",7:"Good",6:"Fine",5:"Average",4:"Bad",3:"Very bad",2:"Horrible",1:"Appalling"};

const EXAMPLES=[
  {id:"ex1",title:"Attack on Titan",kind:"anime",demo:"shounen",type:"TV",year:2013,status:"completed",score:9,genres:["Action","Drama"],seasons:[{n:1,watched:true},{n:2,watched:true,effect:-1,note:"Dragged a bit"},{n:3,watched:true,effect:1},{n:4,watched:true,effect:1}],scoreHistory:[{score:8,date:1614600000000,note:"Great but slow start"}],scoreReason:"The final season changed everything",watchedYear:2023,favorite:true,updatedAt:3},
  {id:"ex2",title:"Mo Dao Zu Shi",altTitle:"The Founder of Diabolism",kind:"donghua",type:"ONA",year:2018,status:"watching",score:9,genres:["Fantasy","Xianxia"],seasons:[{n:1,watched:true},{n:2,watched:true,effect:1},{n:3,watched:false}],updatedAt:2},
  {id:"ex3",title:"Avatar: The Last Airbender",kind:"cartoon",type:"TV",year:2005,status:"completed",score:10,genres:["Adventure","Fantasy","Martial Arts"],seasons:[{n:1,watched:true},{n:2,watched:true},{n:3,watched:true}],watchedYear:2012,updatedAt:1}];

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const norm=t=>String(t||"").toLowerCase().normalize("NFKD").replace(/[^\p{L}\p{N}]+/gu,"");
const newId=()=>"t"+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const isMovie=it=>!!it&&it.type==="Movie";
function seasonsOf(it){return it&&Array.isArray(it.seasons)?it.seasons:[]}
function fmtDate(t){if(!t)return "";try{return new Date(t).toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"})}catch(e){return ""}}
const toInt=v=>{const n=parseInt(v,10);return Number.isFinite(n)?n:null};
let toastTimer;
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,3200)}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* ---------- storage ---------- */
const LS_KEY="celarchive.items.v1";
const store={
  mode:"loading",col:null,items:new Map(),listeners:[],
  async init(){
    let db=null;
    try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
    if(db){
      this.mode="cloud";this.col=db.collection("titles");
      this.col.onSnapshot(snap=>{
        const m=new Map();snap.docs.forEach(d=>{const v=d.data();if(v)m.set(d.id,{...v,id:d.id})});
        this.items=m;this.emit();
      },err=>{
        toast("Lost connection to your saved library. Reload the page to reconnect.");
        setSync("local","Connection lost");
      });
    }else{
      this.mode="local";
      try{const raw=lsGet(LS_KEY);const arr=raw?JSON.parse(raw):[];arr.forEach(x=>this.items.set(x.id,x))}catch(e){}
      this.emit();
    }
  },
  persistLocal(){lsSet(LS_KEY,JSON.stringify([...this.items.values()]))},
  async put(item){
    const clean=JSON.parse(JSON.stringify(item));
    if(this.mode==="cloud"){await this.col.doc(item.id).set(clean)}
    else{this.items.set(item.id,clean);this.persistLocal();this.emit()}
  },
  async remove(id){
    if(this.mode==="cloud"){await this.col.doc(id).delete()}
    else{this.items.delete(id);this.persistLocal();this.emit()}
  },
  onChange(fn){this.listeners.push(fn)},
  emit(){this.loaded=true;this.listeners.forEach(f=>f())}
};
async function withRetry(fn){
  for(let a=0;;a++){
    try{return await fn()}catch(e){
      const c=e&&e.code;
      if((c==="resource_exhausted"||c==="unavailable")&&a<6){await sleep(500*2**a+Math.random()*400);continue}
      throw e;
    }
  }
}
async function writeMany(list,onProgress,conc){
  let i=0,done=0,failed=[];
  const worker=async()=>{while(i<list.length){const it=list[i++];try{await withRetry(()=>store.put(it))}catch(e){failed.push({it,e})}onProgress&&onProgress(++done,list.length)}};
  await Promise.all(Array.from({length:Math.min(conc||4,list.length||1)},worker));
  return failed;
}
function errMsg(e){
  const c=e&&e.code;
  if(c==="quota_exceeded")return "Your library is full (5,000 titles). Delete some entries to add more.";
  if(c==="invalid_argument")return "This view can’t save changes. Open the page signed in as its owner.";
  return "Couldn’t save that change. Check your connection and try again.";
}
function setSync(cls,txt){const s=$("#sync");s.className="sync "+cls;s.textContent=txt}

/* ---------- state + filters ---------- */
const state={status:"all",q:"",kind:"",genre:"",demo:"",sort:lsGet("celarchive.sort")||"updated"};
$("#fsort").value=state.sort;

function items(){return [...store.items.values()]}
function isExampleMode(){return store.loaded&&store.items.size===0}
function viewItems(){
  let list=isExampleMode()?EXAMPLES.map(x=>({...x,_example:true})):items();
  const q=state.q.trim().toLowerCase();
  list=list.filter(it=>{
    if(state.status==="review"){if(!it.needsReview)return false}
    else if(state.status!=="all"&&it.status!==state.status)return false;
    if(state.kind&&it.kind!==state.kind)return false;
    if(state.genre&&!(it.genres||[]).includes(state.genre))return false;
    if(state.demo&&it.demo!==state.demo)return false;
    if(q){const hay=[DEMO_LABEL[it.demo],it.title,it.altTitle,it.notes,(it.genres||[]).join(" "),it.year,KIND_LABEL[it.kind]].join(" ").toLowerCase();if(!hay.includes(q))return false}
    return true;
  });
  const by={
    updated:(a,b)=>(b.updatedAt||0)-(a.updatedAt||0),
    title:(a,b)=>String(a.title).localeCompare(String(b.title),undefined,{sensitivity:"base"}),
    score:(a,b)=>(b.score||0)-(a.score||0)||String(a.title).localeCompare(b.title),
    year_desc:(a,b)=>(b.year||0)-(a.year||0),
    year_asc:(a,b)=>(a.year||9999)-(b.year||9999),
    watched:(a,b)=>(b.watchedYear||0)-(a.watchedYear||0)||(b.updatedAt||0)-(a.updatedAt||0)};
  return list.sort(by[state.sort]||by.updated);
}

/* ---------- render ---------- */
function renderBand(){
  const src=isExampleMode()?EXAMPLES:items();
  const done=src.filter(x=>x.status==="completed");
  const cnt=k=>done.filter(x=>x.kind===k).length;
  const prog=k=>src.filter(x=>x.status==="watching"&&(!k||x.kind===k)).length;
  const other=done.filter(x=>!["anime","donghua","cartoon"].includes(x.kind)).length;
  const scored=src.filter(x=>x.score);
  const mean=scored.length?(scored.reduce((a,b)=>a+b.score,0)/scored.length):null;
  const seasonsW=src.reduce((a,b)=>a+seasonsOf(b).filter(s=>s.watched).length,0);
  const counts=Array.from({length:10},(_,i)=>scored.filter(x=>Math.round(x.score)===i+1).length);
  const max=Math.max(1,...counts);
  const tile=(k,v,sub)=>`<div class="stat"><span class="k">${k}</span><span class="v">${v}</span><span class="s">${sub}</span></div>`;
  $("#band").innerHTML=
    tile("Watched · all",done.length,`${prog()} in progress · ${seasonsW} season${seasonsW===1?"":"s"}`)+
    tile("Anime",cnt("anime"),`${prog("anime")} in progress`)+
    tile("Donghua",cnt("donghua"),`${prog("donghua")} in progress`)+
    tile("Cartoons",cnt("cartoon"),other?`+${other} other animation`:`${prog("cartoon")} in progress`)+
    `<div class="hist" aria-label="Score distribution">
      <span class="k lbl" style="display:flex;justify-content:space-between;gap:8px"><span>Score distribution</span><span>${mean?"mean "+mean.toFixed(2):""}</span></span>
      <div class="bars">${counts.map(c=>`<div class="bar" title="${c} title(s)"><span>${c||""}</span><b class="${c?"":"zero"}" style="height:${c?Math.max(4,c/max*58):2}px"></b></div>`).join("")}</div>
      <div class="axis">${counts.map((_,i)=>`<span>${i+1}</span>`).join("")}</div>
    </div>`;
}
function renderTaste(){
  const el=$("#taste");
  const src=isExampleMode()?EXAMPLES:items();
  const done=src.filter(x=>x.status==="completed");
  if(done.length<1){el.innerHTML="";return}
  const hidden=lsGet("celarchive.tasteHidden")==="1";
  const avgOf=a=>a.length?a.reduce((t,x)=>t+x.score,0)/a.length:null;
  const f1=v=>v==null?"—":v.toFixed(1);
  const rated=done.filter(x=>x.score);
  const g={};done.forEach(x=>(x.genres||[]).forEach(n=>{(g[n]=g[n]||{n,all:[],sc:[]}).all.push(x);if(x.score)g[n].sc.push(x)}));
  const gl=Object.values(g).sort((a,b)=>b.all.length-a.all.length||(avgOf(b.sc)||0)-(avgOf(a.sc)||0));
  const dg={};done.filter(x=>x.demo).forEach(x=>{(dg[x.demo]=dg[x.demo]||{n:x.demo,all:[],sc:[]}).all.push(x);if(x.score)dg[x.demo].sc.push(x)});
  const dgl=Object.values(dg).sort((a,b)=>b.all.length-a.all.length);
  const minN=Math.max(2,Math.round(rated.length*0.04));
  const bestG=[...gl].filter(x=>x.sc.length>=minN).sort((a,b)=>avgOf(b.sc)-avgOf(a.sc))[0];
  const kinds=["anime","donghua","cartoon","aeni","other"].map(k=>({k,sc:rated.filter(x=>x.kind===k)})).filter(x=>x.sc.length);
  const bestK=[...kinds].filter(x=>x.sc.length>=2).sort((a,b)=>avgOf(b.sc)-avgOf(a.sc))[0]||kinds[0];
  const mv=done.filter(x=>x.type==="Movie"),sr=done.filter(x=>x.type!=="Movie");
  const dec={};done.filter(x=>x.year).forEach(x=>{const d=Math.floor(x.year/10)*10;(dec[d]=dec[d]||{d,all:[],sc:[]}).all.push(x);if(x.score)dec[d].sc.push(x)});
  const dl=Object.values(dec);
  const topD=[...dl].sort((a,b)=>b.all.length-a.all.length)[0];
  const bestD=[...dl].filter(x=>x.sc.length>=3).sort((a,b)=>avgOf(b.sc)-avgOf(a.sc))[0];
  const tens=rated.filter(x=>Math.round(x.score)===10);
  const mean=avgOf(rated);
  const hi=rated.length?Math.round(rated.filter(x=>x.score>=8).length/rated.length*100):0;
  const lo=rated.length?Math.round(rated.filter(x=>x.score<=6).length/rated.length*100):0;
  const critic=mean==null?"—":mean>=8?"Generous":mean>=7?"Balanced":"Tough critic";
  const changed=src.filter(x=>(x.scoreHistory||[]).length);
  const up=changed.filter(x=>x.score>(x.scoreHistory.slice(-1)[0].score)).length;
  const card=(k,v,s,hero)=>`<div class="tcard${hero?" hero":""}"><span class="k">${k}</span><span class="v">${v}</span><span class="s">${s}</span></div>`;
  const cards=[
    gl[0]?card("Most watched genre",esc(gl[0].n),`${gl[0].all.length} of ${done.length} watched · avg ${f1(avgOf(gl[0].sc))}`,true):"",
    dgl[0]?card("Most watched demographic",esc(DEMO_LABEL[dgl[0].n]),`${dgl[0].all.length} of ${done.length} watched · avg ${f1(avgOf(dgl[0].sc))}`,true):"",
    bestG?card("Highest-rated genre",esc(bestG.n),`avg ${f1(avgOf(bestG.sc))} across ${bestG.sc.length} titles`):"",
    bestK?card("You rate highest",esc(KIND_LABEL[bestK.k]),kinds.map(x=>`${KIND_LABEL[x.k].split(" ")[0]} ${f1(avgOf(x.sc))}`).join(" · ")):"",
    card("Series vs movies",`${sr.length} / ${mv.length}`,`series avg ${f1(avgOf(sr.filter(x=>x.score)))} · movies avg ${f1(avgOf(mv.filter(x=>x.score)))}`),
    topD?card("Favorite era",`${topD.d}s`,`${topD.all.length} titles${bestD&&bestD.d!==topD.d?` · best rated: ${bestD.d}s (${f1(avgOf(bestD.sc))})`:bestD?` · avg ${f1(avgOf(bestD.sc))}`:""}`):"",
    card("Masterpieces",tens.length,tens.length?esc(tens.slice(0,3).map(x=>x.title).join(", "))+(tens.length>3?` +${tens.length-3} more`:""):"No 10s yet"),
    card("Critic style",critic,`mean ${f1(mean)} · ${hi}% rated 8+ · ${lo}% 6 or below`),
    changed.length?card("Changed your mind",changed.length,`${up} went up · ${changed.length-up} went down`):""
  ].join("");
  const top=gl.slice(0,8),maxC=Math.max(1,...top.map(x=>x.all.length));
  el.innerHTML=`<div class="thead"><h2>Your taste</h2><button type="button" class="linkbtn" data-terms="demographics">What do these terms mean?</button><button type="button" id="tasteTog" aria-expanded="${!hidden}">${hidden?"Show":"Hide"}</button></div>
    ${hidden?"":`<div class="tcards">${cards}</div>
    ${top.length?`<div class="gbars"><span class="k"><span>Genres you watch most</span><span>titles · avg</span></span>
      ${top.map(x=>`<button type="button" class="grow" data-genre="${esc(x.n)}" aria-label="Show ${esc(x.n)} titles"><span class="gname">${esc(x.n)}</span><span class="gtrack"><b style="width:${x.all.length/maxC*100}%"></b></span><span class="gn">${x.all.length}</span><span class="ga">${f1(avgOf(x.sc))}</span></button>`).join("")}</div>`:""}`}`;
  if(!hidden&&dgl.length){const mx=Math.max(...dgl.map(x=>x.all.length));el.insertAdjacentHTML("beforeend",`<div class="gbars"><span class="k"><span>Demographics you watch</span><span>titles · avg</span></span>${dgl.map(x=>`<button type="button" class="grow" data-demo="${x.n}" aria-label="Show ${esc(DEMO_LABEL[x.n])} titles"><span class="gname">${esc(DEMO_LABEL[x.n])}</span><span class="gtrack"><b style="width:${x.all.length/mx*100}%"></b></span><span class="gn">${x.all.length}</span><span class="ga">${f1(avgOf(x.sc))}</span></button>`).join("")}</div>`)}
  $("#tasteTog").onclick=()=>{lsSet("celarchive.tasteHidden",hidden?"0":"1");renderTaste()};
}
$("#taste").addEventListener("click",e=>{const tm=e.target.closest("[data-terms]");if(tm){openTerms(tm.dataset.terms);return}const d=e.target.closest("[data-demo]");if(d&&!isExampleMode()){state.demo=d.dataset.demo;state.genre="";state.status="all";render();$("#fdemo").scrollIntoView({behavior:"smooth",block:"start"});return}
  const b=e.target.closest("[data-genre]");if(!b||isExampleMode())return;state.demo="";state.genre=b.dataset.genre;state.status="all";render();$("#fgenre").scrollIntoView({behavior:"smooth",block:"start"})});
function renderTabs(){
  const src=isExampleMode()?EXAMPLES:items();
  const review=src.filter(x=>x.needsReview).length;
  const tabs=[{k:"all",label:"All",n:src.length},...STATUSES.map(s=>({k:s.k,label:s.label,n:src.filter(x=>x.status===s.k).length,dot:true}))];
  if(review)tabs.push({k:"review",label:"Needs review",n:review,review:true});
  if(state.status==="review"&&!review)state.status="all";
  $("#tabs").innerHTML=tabs.map(t=>`<button class="tab${t.review?" review":""}" data-st="${t.k}" aria-pressed="${state.status===t.k}">${t.dot?`<span class="dot" style="background:var(--st-${t.k})"></span>`:""}${esc(t.label)} <span class="n">${t.n}</span></button>`).join("");
}
function renderSelects(){
  const src=items();
  const dsel=$("#fdemo");dsel.innerHTML=`<option value="">All</option>`+DEMOS.map(x=>`<option value="${x.k}">${x.label}</option>`).join("");dsel.value=state.demo;
  const k=$("#fkind"),g=$("#fgenre");
  k.innerHTML=`<option value="">All kinds</option>`+KINDS.map(x=>`<option value="${x.k}">${x.label}</option>`).join("");
  k.value=state.kind;
  const used=new Set();src.forEach(x=>(x.genres||[]).forEach(z=>used.add(z)));
  const list=[...new Set([...GENRES.filter(x=>used.has(x)),...[...used].sort()])];
  g.innerHTML=`<option value="">All genres</option>`+(list.length?list:GENRES).map(x=>`<option>${esc(x)}</option>`).join("");
  g.value=state.genre;
}
function cardHTML(it){
  const st=it.status||"plan";
  const ss=seasonsOf(it),sw=ss.filter(s=>s.watched).length;
  const pct=st==="completed"?100:(ss.length?sw/ss.length*100:0);
  const meta=[KIND_LABEL[it.kind],DEMO_LABEL[it.demo],it.type,it.year].filter(Boolean).map(esc).join(" · ");
  const prev=(it.scoreHistory||[]).slice(-1)[0];
  const sTxt=isMovie(it)?"Film":(ss.length?(st==="completed"?`${ss.length} season${ss.length>1?"s":""}`:`${sw} of ${ss.length} seasons`):"");
  const fx=e=>e>0?`+${e}`:e<0?`−${-e}`:"±0";
  const chips=!isMovie(it)&&ss.some(s=>s.effect!=null)?`<div class="seasons">${ss.filter(s=>s.effect!=null).map(s=>`<span class="${s.effect>0?"up":s.effect<0?"down":""}">S${s.n}<b>${fx(s.effect)}</b></span>`).join("")}</div>`:"";
  return `<article class="card${it._example?" example":""}" style="--st:var(--st-${st})" data-id="${esc(it.id)}" tabindex="0" role="button" aria-label="${esc(it.title)}, open details">
    ${it._example?`<span class="example-tag">Example</span>`:""}
    <div class="row1">
      <div class="ttl">
        <div class="meta">${meta||"&nbsp;"}${it.watchedYear?`<span>· watched ${esc(it.watchedYear)}</span>`:""}</div>
        <h3>${it.favorite?`<span class="fav" title="Favorite">♥</span> `:""}${esc(it.title)}</h3>
        ${it.altTitle?`<div class="alt">${esc(it.altTitle)}</div>`:""}
      </div>
      <div class="score${it.score?"":" none"}" style="${it._example?"margin-top:14px":""}"><div class="num">${it.score||"–"}</div><div class="lab">${it.score?SCORE_LABEL[Math.round(it.score)]:"unscored"}</div>${prev&&prev.score!==it.score?`<div class="was">was ${prev.score}</div>`:""}</div>
    </div>
    ${(it.genres||[]).length?`<div class="chips">${it.genres.map(g=>`<span class="chip">${esc(g)}</span>`).join("")}</div>`:""}
    ${chips}
    ${it.needsReview?`<div class="chips"><span class="flag">Needs review</span></div>`:""}
    <div class="foot">
      <span class="pill">${esc(ST_LABEL[st])}</span>

}

/* ---------- bulk parser ---------- */
const STATUS_WORDS=[
  [/\b(unfinished|stopped\s*after|finished\s*(?:the\s*)?season)\b/i,"unfinished"],
  [/\b(plan(?:ned)?\s*to\s*watch|ptw|to[\s-]?watch|want\s*to\s*watch|watchlist|backlog|not\s*started)\b/i,"plan"],
  [/\b(on[\s-]?hold|paused|hiatus)\b/i,"on_hold"],
  [/\b(dropped|abandoned|quit|gave\s*up)\b/i,"dropped"],
  [/\b(watching|currently|in[\s-]?progress|ongoing|airing|catching\s*up)\b/i,"watching"],
  [/\b(completed?|finished|done|watched|seen)\b/i,"completed"]];
const KIND_WORDS=[[/\b(donghua|chinese\s*anim\w*|c-?anime)\b/i,"donghua"],[/\b(cartoons?|western\s*anim\w*)\b/i,"cartoon"],[/\b(aeni|korean\s*anim\w*)\b/i,"aeni"],[/\banime\b/i,"anime"]];
const TYPE_WORDS=[[/\b(movies?|films?)\b/i,"Movie"],[/\bova\b/i,"OVA"],[/\bona\b/i,"ONA"],[/\bspecials?\b/i,"Special"],[/\b(tv|series|show)\b/i,"TV"],[/\bshorts?\b/i,"Short"]];
const YEAR_RE=/^(19[2-9]\d|20[0-4]\d)(?:\s*[-–]\s*(?:19|20)?\d{2,4}|\s*[-–]\s*present)?$/i;

function statusOf(s){for(const [re,k] of STATUS_WORDS)if(re.test(s))return k;return null}
function kindOf(s){for(const [re,k] of KIND_WORDS)if(re.test(s))return k;return null}
function typeOf(s){for(const [re,k] of TYPE_WORDS)if(re.test(s))return k;return null}
function genreOf(tok){const t=tok.toLowerCase().replace(/[.\s]+$/,"").trim();const g=GENRE_ALIAS[t];return g?(Array.isArray(g)?g:[g]):null}
function scoreOf(tok){
  let m=tok.match(/^(?:score|rating|rated|my\s*score)?\s*[:=]?\s*(\d{1,3}(?:\.\d+)?)\s*\/\s*(10|5|100)$/i);
  if(m){const v=parseFloat(m[1])/(+m[2])*10;if(v>0&&v<=10)return Math.max(1,Math.round(v))}
  m=tok.match(/^(?:score|rating|rated)\s*[:=]?\s*(\d{1,2}(?:\.\d+)?)$/i);
  if(m){const v=parseFloat(m[1]);if(v>0&&v<=10)return Math.max(1,Math.round(v))}
  const stars=(tok.match(/[★⭐]/g)||[]).length;
  if(stars&&/^[\s★⭐☆]+$/.test(tok)){return Math.min(10,stars*2)}
  if(/^\d{1,2}(\.\d)?$/.test(tok)){const v=parseFloat(tok);if(v>=1&&v<=10)return Math.round(v)}
  return null;
}
function epsOf(tok){
  let m=tok.match(/^(\d{1,4})\s*(?:\/|of)\s*(\d{1,4})\s*(?:eps?|episodes?)?$/i);
  if(m&&/ep/i.test(tok))return {w:+m[1],t:+m[2]};
  m=tok.match(/^(?:eps?\.?|episodes?)\s*(\d{1,4})(?:\s*(?:\/|of)\s*(\d{1,4}))?$/i);
  if(m)return {w:+m[1],t:m[2]?+m[2]:null};
  m=tok.match(/^(\d{1,4})\s*(?:eps?|episodes?)$/i);
  if(m)return {t:+m[1]};
  return null;
}
function classifyToken(tok,rec){
  const t=tok.trim().replace(/^[\s:=]+|[\s.]+$/g,"");if(!t)return true;
  if(/^[✅✔✓☑]$/.test(t)){rec.status=rec.status||"completed";return true}
  if(/^[❌✗✘]$/.test(t)){rec.status=rec.status||"dropped";return true}
  const y=t.match(YEAR_RE);if(y){rec.year=+y[1];return true}
  const wm=t.match(/^(?:watched|finished|seen)\s*(?:in)?\s*(19[5-9]\d|20[0-4]\d)$/i);if(wm){rec.watchedYear=+wm[1];rec.status=rec.status||"completed";return true}
  const sc=scoreOf(t);if(sc){rec.score=sc;return true}
  const sn=t.match(/^(\d{1,2})\s*seasons?$/i)||t.match(/^seasons?\s*[:=]?\s*(\d{1,2})$/i)||t.match(/^s(?:easons?)?\s*1\s*[-–]\s*s?(\d{1,2})$/i);if(sn){rec.seasonCount=+sn[1];return true}
  const ep=epsOf(t);if(ep){if(ep.w!=null)rec.epWatched=ep.w;if(ep.t!=null)rec.epTotal=ep.t;return true}
  const dm0=/^(sh[oō]u?nen|seinen|sh[oō]u?jo|josei|kodomo)$/i.test(t)?demoOf(t):null;if(dm0){rec.demo=dm0;return true}
  const g=genreOf(t);if(g){g.forEach(x=>{if(!rec.genres.includes(x))rec.genres.push(x)});return true}
  if(t.includes("/")){const ps=t.split("/").map(genreOf);if(ps.every(Boolean)){ps.flat().forEach(x=>{if(!rec.genres.includes(x))rec.genres.push(x)});return true}}

$("#fileJson").addEventListener("change",async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  let parsed;try{parsed=JSON.parse(await f.text())}catch(err){toast("That file isn’t a valid backup (.json).");return}
  const arr=Array.isArray(parsed)?parsed:parsed&&parsed.items;
  if(!Array.isArray(arr)||!arr.length){toast("No titles found in that backup.");return}
  const docs=arr.filter(x=>x&&x.title).map(x=>({...x,id:typeof x.id==="string"&&/^[\w\-.~:@+]+$/.test(x.id)?x.id:newId()}));
  toast(`Restoring ${docs.length} titles…`);
  const failed=await writeMany(docs,null,4);
  toast(failed.length?`${docs.length-failed.length} restored, ${failed.length} failed.`:`Restored ${docs.length} titles`);
});
function openDeleteAll(){

  openSheet(`<header><h2>Delete entire library</h2><button class="x" data-close aria-label="Close">×</button></header>
    <div class="body"><p class="help">This permanently removes all <b>${n}</b> titles on every device. Download a backup first if you might want them back.</p>
    <div class="field"><label for="daIn">Type DELETE to confirm</label><input type="text" id="daIn" autocomplete="off" autofocus></div>
    <div class="progressline" id="daProg" hidden><b></b></div></div>
    <div class="foot-bar"><button class="btn" id="daBackup">Download backup first</button><span class="sp"></span><button class="btn" data-close>Cancel</button><button class="btn danger" id="daGo" disabled>Delete ${n} titles</button></div>`);
  $("#daIn").oninput=e=>$("#daGo").disabled=e.target.value.trim()!=="DELETE";

  $("#daGo").onclick=async()=>{

/* XLSX-BUILDER-START */
function buildWorkbook(ExcelJS,list,opts){
  opts=opts||{};
  const STL={watching:"Watching",completed:"Completed",unfinished:"Unfinished",on_hold:"On hold",dropped:"Dropped",plan:"Plan to watch"};
  const STC={watching:["FF23805A","FFE3F2EA"],completed:["FF2C5FB3","FFE2EAF8"],unfinished:["FF7A4FB5","FFEFE7F9"],on_hold:["FF9A6C0C","FFF8EED6"],dropped:["FFA83246","FFF6E0E4"],plan:["FF5F6371","FFECEDF0"]};
  const KL={anime:"Anime",donghua:"Donghua",cartoon:"Cartoon",aeni:"Aeni (Korean)",other:"Other"};
  const SL={10:"Masterpiece",9:"Great",8:"Very good",7:"Good",6:"Fine",5:"Average",4:"Bad",3:"Very bad",2:"Horrible",1:"Appalling"};
  const SCOREFILL={10:"FF1E7A4F",9:"FF2E8B57",8:"FF5BA85B",7:"FF94BF4E",6:"FFC9C443",5:"FFE0B040",4:"FFE08A3C",3:"FFD9663A",2:"FFC94A3A",1:"FFA8323A"};
  const INK="FF171A28",ACC="FFD3305A",PAPER="FFFAFBF6",ZEBRA="FFF1F3EC",LINE="FFD5D9CF",MUTED="FF5B6070";
  const FONT="Arial";
  const order={watching:0,completed:1,unfinished:2,on_hold:3,dropped:4,plan:5};
  const rows=[...list].sort((a,b)=>(order[a.status]??9)-(order[b.status]??9)||(b.score||0)-(a.score||0)||String(a.title).localeCompare(String(b.title)));
  const scored=list.filter(x=>x.score);
  const mean=scored.length?scored.reduce((s,x)=>s+x.score,0)/scored.length:null;
  const seas=list.reduce((s,x)=>s+(Array.isArray(x.seasons)?x.seasons.filter(y=>y.watched).length:0),0);
  const kc=k=>list.filter(x=>x.status==="completed"&&x.kind===k).length;
  const done=list.filter(x=>x.status==="completed").length;
  const today=new Date().toLocaleDateString("en-US",{year:"numeric",month:"long",day:"numeric"});
  const owner=(opts.owner||"").trim();
  const heading=owner?`${owner}’s Animation Library`:"My Animation Library";

  const wb=new ExcelJS.Workbook();wb.creator="Cel Archive";wb.created=new Date();
  const thin={style:"thin",color:{argb:LINE}};
  const fill=c=>({type:"pattern",pattern:"solid",fgColor:{argb:c}});

  /* ---- Library sheet ---- */
  const ws=wb.addWorksheet("Library",{properties:{tabColor:{argb:ACC}},views:[{state:"frozen",ySplit:5,xSplit:2,showGridLines:false}]});
  const cols=[
    {h:"#",w:5},{h:"Title",w:38},{h:"Other title",w:26},{h:"Kind",w:12},{h:"Format",w:10},{h:"Year",w:7},
    {h:"Status",w:15},{h:"Score",w:7},{h:"Rating",w:13},{h:"Seasons",w:18},{h:"Genres",w:30},{h:"Watched",w:9},{h:"♥",w:4},{h:"Notes",w:40}];
  ws.columns=cols.map(c=>({width:c.w}));
  const last=cols.length;
  ws.mergeCells(1,1,1,last);ws.mergeCells(2,1,2,last);ws.mergeCells(3,1,3,last);
  const t=ws.getCell(1,1);t.value=heading;t.font={name:"Arial Black",size:22,color:{argb:"FFFFFFFF"}};t.alignment={vertical:"middle",indent:1};
  const s=ws.getCell(2,1);
  s.value=`${done} watched   ·   ${kc("anime")} anime   ·   ${kc("donghua")} donghua   ·   ${kc("cartoon")} cartoons   ·   ${seas} seasons   ·   mean score ${mean?mean.toFixed(2):"—"}`;
  s.font={name:FONT,size:11,color:{argb:"FFE8EAF0"}};s.alignment={vertical:"middle",indent:1};
  const d=ws.getCell(3,1);d.value=`Shared ${today} from Cel Archive`;d.font={name:FONT,size:9,italic:true,color:{argb:"FF9BA1B4"}};d.alignment={vertical:"top",indent:1};
  for(let r=1;r<=3;r++)for(let c=1;c<=last;c++)ws.getCell(r,c).fill=fill(INK);
  ws.getRow(1).height=40;ws.getRow(2).height=20;ws.getRow(3).height=18;
  for(let c=1;c<=last;c++)ws.getCell(4,c).fill=fill(ACC);ws.getRow(4).height=5;
  const hr=ws.getRow(5);hr.height=24;
  cols.forEach((c,i)=>{const cell=hr.getCell(i+1);cell.value=c.h;cell.font={name:FONT,bold:true,size:10,color:{argb:INK}};cell.fill=fill("FFE3E6DD");
    cell.alignment={vertical:"middle",horizontal:[0,5,7,11,12].includes(i)?"center":"left",indent:[0,5,7,11,12].includes(i)?0:1};cell.border={bottom:{style:"medium",color:{argb:INK}}}});
  rows.forEach((it,k)=>{
    const r=ws.getRow(6+k);r.height=20;
    const ssA=Array.isArray(it.seasons)?it.seasons:[];const ssW=ssA.filter(y=>y.watched).length;
    const fxs=ssA.filter(y=>y.effect!=null&&y.effect!==0).map(y=>`S${y.n} ${y.effect>0?"+":"−"}${Math.abs(y.effect)}`).join(", ");
    const epTxt=(it.type==="Movie"?"Film":(ssA.length?(it.status==="completed"?String(ssA.length):`${ssW} / ${ssA.length}`):""))+(fxs?`  (${fxs})`:"");
    const prevS=(it.scoreHistory||[]).slice(-1)[0];
    const vals=[k+1,it.title||"",it.altTitle||"",KL[it.kind]||"",it.type||"",it.year||"",STL[it.status]||"",it.score||"",(it.score?SL[Math.round(it.score)]:"")+(prevS&&prevS.score!==it.score?` (was ${prevS.score})`:""),epTxt,[({shounen:"Shounen",seinen:"Seinen",shoujo:"Shoujo",josei:"Josei",kodomo:"Kids",general:"General"})[it.demo],(it.genres||[]).join(", ")].filter(Boolean).join(" · "),it.watchedYear||"",it.favorite?"♥":"",it.notes||""];
    const base=k%2?ZEBRA:PAPER;
    vals.forEach((v,i)=>{
      const cell=r.getCell(i+1);cell.value=v;cell.fill=fill(base);cell.border={bottom:thin};
      cell.font={name:FONT,size:10,color:{argb:i===0||i===2||i===13?MUTED:INK}};
      cell.alignment={vertical:"middle",horizontal:[0,5,7,9,11,12].includes(i)?"center":"left",indent:[0,5,7,9,11,12].includes(i)?0:1,wrapText:i===13};
    });
    r.getCell(2).font={name:FONT,size:10.5,bold:true,color:{argb:INK}};
    const sc=STC[it.status];if(sc){const c=r.getCell(7);c.fill=fill(sc[1]);c.font={name:FONT,size:10,bold:true,color:{argb:sc[0]}}}
    if(it.score){const c=r.getCell(8);c.fill=fill(SCOREFILL[Math.round(it.score)]);c.font={name:"Arial Black",size:11,color:{argb:"FFFFFFFF"}};
      r.getCell(9).font={name:FONT,size:9.5,italic:true,color:{argb:MUTED}}}
    r.getCell(13).font={name:FONT,size:12,color:{argb:ACC}};
    if(it.notes&&String(it.notes).length>60)r.height=Math.min(80,20+Math.ceil(String(it.notes).length/60)*12);
  });
  const lastRow=5+rows.length;
  ws.autoFilter={from:{row:5,column:1},to:{row:Math.max(5,lastRow),column:last}};
  ws.pageSetup={orientation:"landscape",fitToPage:true,fitToWidth:1,fitToHeight:0,printTitlesRow:"5:5",margins:{left:.4,right:.4,top:.5,bottom:.5,header:.2,footer:.2}};
  ws.headerFooter={oddFooter:`&L&8${heading}&R&8Page &P of &N`};

  /* ---- Summary sheet ---- */
  const sm=wb.addWorksheet("Summary",{properties:{tabColor:{argb:INK}},views:[{showGridLines:false}]});
  sm.columns=[{width:3},{width:20},{width:9},{width:34},{width:4},{width:20},{width:9},{width:34}];
  sm.mergeCells("A1:H1");const st=sm.getCell("A1");st.value="At a glance";st.font={name:"Arial Black",size:18,color:{argb:"FFFFFFFF"}};st.alignment={vertical:"middle",indent:1};
  for(let c=1;c<=8;c++)sm.getCell(1,c).fill=fill(INK);sm.getRow(1).height=36;
  for(let c=1;c<=8;c++)sm.getCell(2,c).fill=fill(ACC);sm.getRow(2).height=4;
  // KPI row
  const kpis=[["Watched · all",done],["Anime",kc("anime")],["Donghua",kc("donghua")],["Cartoons",kc("cartoon")]];
  const kcols=[2,4,6,8];
  kpis.forEach(([lab,val],i)=>{const c=kcols[i];
    const a=sm.getCell(4,c);a.value=lab.toUpperCase();a.font={name:FONT,size:8.5,bold:true,color:{argb:MUTED}};
    const b=sm.getCell(5,c);b.value=val;b.font={name:"Arial Black",size:20,color:{argb:i===0?ACC:INK}};b.alignment={horizontal:"left"}});
  sm.getRow(5).height=30;
  const bar=(n,max)=>max?"■".repeat(Math.max(n?1:0,Math.round(n/max*24))):"";
  function table(r0,c0,title,data,colorFor){
    const h=sm.getCell(r0,c0);h.value=title;h.font={name:FONT,bold:true,size:11,color:{argb:INK}};
    [c0,c0+1,c0+2].forEach(c=>{sm.getCell(r0,c).border={bottom:{style:"medium",color:{argb:INK}}}});
    const max=Math.max(0,...data.map(x=>x[1]));
    data.forEach(([lab,n],i)=>{const r=r0+1+i;
      const a=sm.getCell(r,c0);a.value=lab;a.font={name:FONT,size:10,color:{argb:INK}};
      const b=sm.getCell(r,c0+1);b.value=n;b.font={name:FONT,size:10,bold:true,color:{argb:INK}};b.alignment={horizontal:"center"};
      const g=sm.getCell(r,c0+2);g.value=bar(n,max);g.font={name:FONT,size:9,color:{argb:(colorFor&&colorFor(lab,i))||ACC}};
      [c0,c0+1,c0+2].forEach(c=>sm.getCell(r,c).border={bottom:thin});
    });
    return r0+1+data.length;
  }
  const byStatus=Object.keys(STL).map(k=>[STL[k],list.filter(x=>x.status===k).length]);
  const byKind=Object.keys(KL).map(k=>[KL[k],list.filter(x=>x.kind===k).length]).filter(x=>x[1]);
  const gc={};list.forEach(x=>(x.genres||[]).forEach(g=>gc[g]=(gc[g]||0)+1));
  const topG=Object.entries(gc).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const dist=Array.from({length:10},(_,i)=>[`${10-i} · ${SL[10-i]}`,scored.filter(x=>Math.round(x.score)===10-i).length]);
  const stColor=lab=>{const k=Object.keys(STL).find(k=>STL[k]===lab);return k?STC[k][0]:ACC};
  let a=table(7,2,"By status",byStatus,stColor);
  let b=table(7,6,"Score distribution",dist,(lab,i)=>SCOREFILL[10-i]);
  let r2=Math.max(a,b)+2;
  a=table(r2,2,"By kind",byKind.length?byKind:[["—",0]]);
  b=table(r2,6,"Top genres",topG.length?topG:[["—",0]]);

  /* ---- Top rated sheet ---- */
  const top=list.filter(x=>x.score>=9||x.favorite).sort((a,b)=>(b.score||0)-(a.score||0)||(b.favorite?1:0)-(a.favorite?1:0));
  if(top.length){
    const tp=wb.addWorksheet("Top picks",{properties:{tabColor:{argb:"FF1E7A4F"}},views:[{showGridLines:false,state:"frozen",ySplit:3}]});
    tp.columns=[{width:3},{width:7},{width:40},{width:12},{width:7},{width:32}];
    tp.mergeCells("A1:F1");const tt=tp.getCell("A1");tt.value="Top picks — scored 9+ or favorited";tt.font={name:"Arial Black",size:16,color:{argb:"FFFFFFFF"}};tt.alignment={vertical:"middle",indent:1};
    for(let c=1;c<=6;c++){tp.getCell(1,c).fill=fill(INK);tp.getCell(2,c).fill=fill(ACC)}tp.getRow(1).height=34;tp.getRow(2).height=4;
    ["","Score","Title","Kind","Year","Genres"].forEach((h,i)=>{const c=tp.getCell(3,i+1);c.value=h;c.font={name:FONT,bold:true,size:10};c.border={bottom:{style:"medium",color:{argb:INK}}}});
    top.forEach((it,k)=>{const r=4+k;tp.getRow(r).height=20;
      const sc=tp.getCell(r,2);sc.value=it.score||"♥";sc.alignment={horizontal:"center",vertical:"middle"};
      if(it.score){sc.fill=fill(SCOREFILL[Math.round(it.score)]);sc.font={name:"Arial Black",size:11,color:{argb:"FFFFFFFF"}}}else sc.font={name:FONT,size:12,color:{argb:ACC}};
      const ti=tp.getCell(r,3);ti.value=(it.favorite&&it.score?"♥ ":"")+it.title;ti.font={name:FONT,bold:true,size:10.5};ti.alignment={vertical:"middle",indent:1};
      [[4,KL[it.kind]||""],[5,it.year||""],[6,(it.genres||[]).join(", ")]].forEach(([c,v])=>{const x=tp.getCell(r,c);x.value=v;x.font={name:FONT,size:10,color:{argb:MUTED}};x.alignment={vertical:"middle",horizontal:c===5?"center":"left",indent:c===5?0:1}});
      for(let c=1;c<=6;c++)tp.getCell(r,c).border={bottom:thin};
    });
  }
  return wb;
}

function saveBlob(blob,filename){
  try{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);return true}catch(e){return false}
}
function loadExcel(){
  if(window.ExcelJS)return Promise.resolve();
  const srcs=["https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js","https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"];
  const tryOne=i=>new Promise((res,rej)=>{if(i>=srcs.length)return rej(new Error("offline"));const sc=document.createElement("script");sc.src=srcs[i];sc.onload=()=>window.ExcelJS?res():tryOne(i+1).then(res,rej);sc.onerror=()=>{sc.remove();tryOne(i+1).then(res,rej)};document.head.appendChild(sc)});
  return tryOne(0);
}

    }catch(e){$("#shGo").disabled=false;$("#shGo").textContent="Download .xlsx";toast("Couldn’t build the spreadsheet. Try again.")}

  ["Cour","クール","A 3-month broadcast block of about 12–13 episodes. A “2-cour” season runs about 24 episodes.",""]]},
 {id:"statuses",title:"Your statuses",items:[
  ["Completed","","You watched everything that's out.",""],
  ["Watching","","You're in the middle of it now.",""],
  ["Unfinished","","You finished at least one full season, then stopped.",""],
  ["Dropped","","You stopped partway through a season.",""],
  ["On hold","","Paused, but you plan to come back.",""],
  ["Plan to watch","","On your list, not started.",""]]},
 {id:"scores",title:"Score scale",note:"The same 1–10 scale MyAnimeList uses.",items:Object.keys(SCORE_LABEL).sort((a,b)=>b-a).map(k=>[`${k} · ${SCORE_LABEL[k]}`,"","",""])}
];
function openTerms(focus,fromEdit){
  const back=fromEdit?document.getElementById("sheetSlot").innerHTML:null;
  const secs=TERMS.map(sec=>`<section class="gl-sec" id="gl-${sec.id}"><h3>${esc(sec.title)}</h3>${sec.note?`<p class="help">${esc(sec.note)}</p>`:""}
    <dl class="gl-list">${sec.items.map(([t,sub,d,ex])=>`<div class="gl-item" data-q="${esc((t+" "+sub+" "+d+" "+ex).toLowerCase())}"><dt>${esc(t)}${sub?`<small>${esc(sub)}</small>`:""}</dt>${d?`<dd>${esc(d)}</dd>`:""}${ex?`<dd>e.g. <i>${esc(ex)}</i></dd>`:""}</div>`).join("")}</dl></section>`).join("");
  if(fromEdit){
    const wrap=document.createElement("div");wrap.className="scrim";wrap.style.zIndex="60";
    wrap.innerHTML=`<div class="sheet wide" role="dialog" aria-modal="true"><header><h2>Terms</h2><button class="x" aria-label="Close">×</button></header><div class="body">${secs}</div></div>`;
    document.body.appendChild(wrap);
    const close=()=>wrap.remove();wrap.querySelector(".x").onclick=close;wrap.addEventListener("mousedown",e=>{if(e.target===wrap)close()});
    const el=wrap.querySelector("#gl-"+focus);if(el)setTimeout(()=>el.scrollIntoView&&el.scrollIntoView({block:"start"}),30);
    return;
  }
  openSheet(`<header><h2>Terms</h2><button class="x" data-close aria-label="Close">×</button></header>
    <div class="body"><div class="field"><label for="glq">Look up a term</label><input type="search" id="glq" placeholder="e.g. seinen, isekai, OVA"></div>${secs}</div>
    <div class="foot-bar"><span class="sp"></span><button class="btn" data-close>Close</button></div>`,true);
  $("#glq").oninput=e=>{const q=e.target.value.trim().toLowerCase();
    document.querySelectorAll(".gl-item").forEach(x=>{const m=!q||x.dataset.q.includes(q);x.hidden=!m;x.classList.toggle("hit",!!q&&m)});
    document.querySelectorAll(".gl-sec").forEach(sec=>{sec.hidden=![...sec.querySelectorAll(".gl-item")].some(x=>!x.hidden)})};
  if(focus){const el=document.getElementById("gl-"+focus);if(el)setTimeout(()=>el.scrollIntoView&&el.scrollIntoView({block:"start"}),30)}
}

/* ---------- boot ---------- */
store.onChange(()=>{
  const lb=+lsGet("celarchive.lastBackup")||0;
  const days=lb?Math.floor((Date.now()-lb)/864e5):null;
  const stale=store.items.size&&(days===null||days>=14);
  setSync(stale?"local":"ok","Saved on this device · "+(lb?(days===0?"backed up today":`last backup ${days} day${days===1?"":"s"} ago`):"no backup yet"));
  render();
});
render();
store.init();
})();
