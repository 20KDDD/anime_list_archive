name: Update anime news

# Runs in GitHub's cloud (no browser CORS limits, no API key), fetches the RSS
# feeds, and commits news.json to the repo. GitHub Pages then serves it, and the
# News tab reads it same-origin. Free for public repos.

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours (UTC)
  workflow_dispatch: {}       # lets you run it on demand from the Actions tab
  push:
    paths:
      - ".github/workflows/news.yml"
      - "scripts/fetch-news.js"

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch news
        run: node scripts/fetch-news.js

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- news.json; then
            git add news.json
            git commit -m "chore: update anime news [skip ci]"
            git push
          else
            echo "No news changes."
          fi
